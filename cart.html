<!DOCTYPE html><html lang="ar" dir="rtl"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>السلة</title><link href="https://fonts.googleapis.com/css2?family=Cairo:wght@700;800&display=swap" rel="stylesheet"><style>:root{--bg:#0e0e10;--card:#1c1c1f;--yellow:#FFD500;--gray:#9a9aa0}*{margin:0;padding:0;box-sizing:border-box;font-family:'Cairo'}body{background:var(--bg);color:white;min-height:100vh;display:flex;flex-direction:column}.header{padding:16px;display:flex;gap:12px;align-items:center;border-bottom:1px solid #222}.back{width:36px;height:36px;background:#232326;border-radius:50%;display:grid;place-items:center;text-decoration:none;color:white}.content{flex:1;padding:16px;max-width:600px;margin:0 auto;width:100%}.cartItem{background:var(--card);padding:10px;border-radius:16px;display:flex;gap:12px;align-items:center;margin-bottom:12px}.cartItem img{width:64px;height:64px;border-radius:12px;object-fit:cover}.qty{display:flex;gap:8px;align-items:center;margin-left:auto}.qty button{width:32px;height:32px;border-radius:50%;border:none;font-weight:900}.minus{background:#333;color:white}.plus{background:var(--yellow);color:black}.totalBox{background:var(--card);padding:16px;border-radius:16px;margin-top:20px}.totalRow{display:flex;justify-content:space-between;font-weight:800;font-size:20px;margin-bottom:16px}.totalRow span:last-child{color:var(--yellow)}.btn{width:100%;padding:16px;border-radius:14px;border:none;font-weight:900;font-size:16px;cursor:pointer}.btnYellow{background:var(--yellow);color:black}.btnGray{background:#232326;color:white;margin-top:10px}.empty{text-align:center;color:var(--gray);margin-top:60px}</style></head><body><div class="header"><a href="index.html" class="back">→</a><h2>سلة الطاهي 🛒</h2></div><div class="content"><div id="list"></div><div class="totalBox" id="totalBox"><div class="totalRow"><span>الإجمالي:</span><span id="total">0 ج</span></div><button class="btn btnYellow" onclick="goCheckout()">تأكيد الطلبات → تسجيل بياناتي</button><a href="index.html" style="text-decoration:none"><button class="btn btnGray">+ اضافة اصناف اخرى</button></a></div><div id="empty" class="empty" style="display:none"><p style="font-size:50px">🛒</p><p>السلة فاضية</p><br><a href="index.html" style="color:var(--yellow)">ابدأ الطلب →</a></div></div><script>function getCart(){return JSON.parse(localStorage.getItem('tahey_cart')||'[]')}function saveCart(c){localStorage.setItem('tahey_cart',JSON.stringify(c));render()}function render(){let cart=getCart();if(cart.length==0){document.getElementById('list').style.display='none';document.getElementById('totalBox').style.display='none';document.getElementById('empty').style.display='block';return}document.getElementById('list').style.display='block';document.getElementById('totalBox').style.display='block';document.getElementById('empty').style.display='none';document.getElementById('list').innerHTML=cart.map((c,i)=>`<div class="cartItem"><img src="${c.img}"><div><div style="font-weight:700;font-size:13px">${c.name.split(' - ')[0]}</div><div style="font-size:11px;color:#9a9aa0">${c.price} ج</div></div><div class="qty"><button class="minus" onclick="changeQ(${i},-1)">-</button><span>${c.q}</span><button class="plus" onclick="changeQ(${i},1)">+</button></div></div>`).join('');document.getElementById('total').innerText=cart.reduce((a,b)=>a+b.price*b.q,0)+' ج'}function changeQ(i,d){let c=getCart();c[i].q+=d;if(c[i].q<=0)c.splice(i,1);saveCart(c)}function goCheckout(){if(getCart().length==0){alert('السلة فاضية');return}location.href='checkout.html'}render();</script></body></html>
