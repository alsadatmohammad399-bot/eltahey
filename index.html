<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>الطاهي | EL TAHEY -  أصل المذاق المصري</title>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@600;700;800;900&display=swap" rel="stylesheet">
<style>
:root{--bg:#0e0e10;--card:#1c1c1f;--yellow:#FFD500;--gray:#9a9aa0;--border:#2a2a2e}
*{margin:0;padding:0;box-sizing:border-box;font-family:'Cairo',sans-serif}
body{background:var(--bg);color:white}
.header{padding:14px 16px;display:flex;justify-content:space-between;align-items:center;position:sticky;top:0;background:rgba(14,14,16,.97);z-index:50;border-bottom:1px solid var(--border)}
.logo{display:flex;align-items:center;gap:10px}
.logo-icon{width:44px;height:44px;background:linear-gradient(135deg,#FFD500,#FF8C00);border-radius:12px;display:grid;place-items:center;color:black;font-weight:900;font-size:22px}
.main{font-weight:900;font-size:20px}.main span{color:var(--yellow)}small{color:var(--gray);font-size:10px}
.cartTop{background:var(--yellow);color:black;padding:8px 16px;border-radius:24px;font-weight:800;display:flex;gap:6px;text-decoration:none}
.search{margin:10px 16px;background:var(--card);border-radius:30px;display:flex;align-items:center;padding:12px 16px;gap:10px;border:1px solid var(--border)}
.search input{flex:1;background:transparent;border:none;color:white;outline:none}
.cats{padding:10px 16px;display:flex;gap:10px;overflow-x:auto}.cats::-webkit-scrollbar{display:none}
.catItem{min-width:72px;background:var(--card);border-radius:18px;padding:12px 8px;text-align:center;cursor:pointer;border:2px solid transparent;flex-shrink:0}
.catItem.active{border-color:var(--yellow);background:#2a2a20}
.sectionHeader{padding:16px 16px 8px;display:flex;gap:10px;align-items:center}
.sectionHeader .count{background:var(--card);padding:2px 10px;border-radius:20px;font-size:11px;color:var(--gray)}
.list{padding:0 16px 20px;display:flex;flex-direction:column;gap:10px}
.itemRow{background:var(--card);border-radius:16px;display:flex;overflow:hidden;border:1px solid var(--border);min-height:90px}
.itemRow img{width:90px;height:90px;object-fit:cover}
.itemInfo{flex:1;padding:10px;display:flex;flex-direction:column;justify-content:center}
.itemInfo h4{font-size:13px;font-weight:800;line-height:1.3}
.itemInfo p{font-size:10px;color:var(--gray)}
.itemAction{padding:10px;display:flex;flex-direction:column;justify-content:space-between;align-items:flex-end}
.price{color:var(--yellow);font-weight:900;font-size:14px}
.addBtn{width:32px;height:32px;background:var(--yellow);border:none;border-radius:50%;font-weight:900;color:black;cursor:pointer;font-size:18px;display:grid;place-items:center}
.hero{margin:12px 16px;border-radius:20px;background:linear-gradient(90deg,#1c1c1f,#2a2a20);padding:16px;display:flex;justify-content:space-between;align-items:center;border:1px solid var(--border)}
.btnY{background:var(--yellow);color:black;border:none;padding:8px 16px;border-radius:20px;font-weight:800;cursor:pointer;font-size:12px}
</style>
</head>
<body>
<div class="header"><div class="logo"><div class="logo-icon">ط</div><div><div class="main">الطاهي <span>EL TAHEY</span></div><small>90 صنف - أصل المذاق</small></div></div><a href="cart.html" class="cartTop">🛒 <span id="cartCount">0</span></a></div>
<div class="search"><span>🔍</span><input id="searchInput" placeholder="ابحث في 90 صنف..." oninput="filterSearch()"></div>
<div class="hero"><div><h3 style="color:var(--yellow)">عرض خاص 🔥</h3><h2 style="font-size:15px">خصم 20% على أول طلب</h2><p style="color:var(--gray);font-size:11px">للشركات والمناسبات</p></div><button class="btnY" onclick="document.getElementById('menuSection').scrollIntoView({behavior:'smooth'})">اطلب الآن →</button></div>
<div class="cats" id="cats"></div>
<div id="menuSection"></div>

lash.com/photo-1504674900247-0877df9cc836?w=400"}, {"n": "نص ممبار", "p": 200, "img": "https://images.unsplash.com/photo-1504674900247-0877df9cc836?w=400"}, {"n": "ربع ممبار", "p": 170, "img": "https://images.unsplash.com/photo-1504674900247-0877df9cc836?w=400"}]}, {"c": "طلب كفته", "ico": "🥙", "items": [{"n": "طلب كفته - 3 قطع + أرز + خضار + سلطة", "p": 100, "img": "https://images.unsplash.com/photo-1555939594-58d7cb561ad1?w=400"}]}, {"c": "صواني الطاهي", "ico": "🥘", "items": [{"n": "صنية السيزون - كيلو كفته + نص فرخة + ربع سجق + أرز بسمتي", "p": 900, "img": "https://images.unsplash.com/photo-1511690656952-a0c5a7722f1c?w=400"}, {"n": "صنية السويسي - فرخة + نص كفته + ربع سجق + أرز بسمتي", "p": 850, "img": "https://images.unsplash.com/photo-1511690656952-a0c5a7722f1c?w=400"}]}, {"c": "ميكس الطاهي", "ico": "🔥", "items": [{"n": "ميكس كفته وطرب", "p": 170, "img": "https://images.unsplash.com/photo-1525183995014-b329225b9407?w=400"}, {"n": "ميكس شيش واستربس", "p": 170, "img": "https://images.unsplash.com/photo-1562967914-608f82629710?w=400"}, {"n": "ميكس كفته وشيش", "p": 170, "img": "https://images.unsplash.com/photo-1599487488170-d11ec9c172f0?w=400"}, {"n": "ميكس شيش وطرب", "p": 170, "img": "https://images.unsplash.com/photo-1529193591184-b1d58069ecdd?w=400"}, {"n": "ميكس استربس وكفته", "p": 170, "img": "https://images.unsplash.com/photo-1562967914-608f82629710?w=400"}, {"n": "المكساوي", "p": 180, "img": "https://images.unsplash.com/photo-1525183995014-b329225b9407?w=400"}]}, {"c": "وجبات البروست", "ico": "🍗", "items": [{"n": "وجبة بروست الطاهي - 2 قطعة", "p": 160, "img": "https://images.unsplash.com/photo-1562967914-608f82629710?w=400"}, {"n": "تربيل هيت - 3 قطع", "p": 200, "img": "https://images.unsplash.com/photo-1562967914-608f82629710?w=400"}, {"n": "الذهبية - 4 قطع", "p": 250, "img": "https://images.unsplash.com/photo-1562967914-608f82629710?w=400"}, {"n": "باور - 5 قطع", "p": 280, "img": "https://images.unsplash.com/photo-1562967914-608f82629710?w=400"}, {"n": "لمه الحبايب - 10 قطع", "p": 420, "img": "https://images.unsplash.com/photo-1562967914-608f82629710?w=400"}, {"n": "العمالقة - 12 قطعة", "p": 500, "img": "https://images.unsplash.com/photo-1562967914-608f82629710?w=400"}, {"n": "الديك - 15 قطعة", "p": 600, "img": "https://images.unsplash.com/photo-1562967914-608f82629710?w=400"}]}, {"c": "السلطات", "ico": "🥗", "items": [{"n": "سلطة خضراء", "p": 25, "img": "https://images.unsplash.com/photo-1540420773420-3366772f4999?w=400"}, {"n": "طحينة", "p": 25, "img": "https://images.unsplash.com/photo-1540420773420-3366772f4999?w=400"}, {"n": "بابا غنوج", "p": 30, "img": "https://images.unsplash.com/photo-1540420773420-3366772f4999?w=400"}, {"n": "تومية", "p": 30, "img": "https://images.unsplash.com/photo-1540420773420-3366772f4999?w=400"}, {"n": "كول سلو", "p": 30, "img": "https://images.unsplash.com/photo-1540420773420-3366772f4999?w=400"}, {"n": "باذنجان مخلل", "p": 20, "img": "https://images.unsplash.com/photo-1540420773420-3366772f4999?w=400"}]}, {"c": "أطباق جانبية", "ico": "🍚", "items": [{"n": "أرز ساده بالشعرية", "p": 25, "img": "https://images.unsplash.com/photo-1536304929831-ee1ca9d44906?w=400"}, {"n": "أرز بالكبده صغير", "p": 50, "img": "https://images.unsplash.com/photo-1536304929831-ee1ca9d44906?w=400"}, {"n": "أرز بالكبده كبير", "p": 60, "img": "https://images.unsplash.com/photo-1536304929831-ee1ca9d44906?w=400"}, {"n": "أرز بسمتي وسط", "p": 35, "img": "https://images.unsplash.com/photo-1536304929831-ee1ca9d44906?w=400"}, {"n": "أرز بسمتي كبير", "p": 55, "img": "https://images.unsplash.com/photo-1536304929831-ee1ca9d44906?w=400"}, {"n": "مكرونة فرن", "p": 35, "img": "https://images.unsplash.com/photo-1621996346565-e3dbc646d9a9?w=400"}, {"n": "ملوخية", "p": 40, "img": "https://images.unsplash.com/photo-1504674900247-0877df9cc836?w=400"}, {"n": "شوربة لسان عصفور", "p": 25, "img": "https://images.unsplash.com/photo-1547592166-23ac45744acd?w=400"}, {"n": "خضار حسب اليوم", "p": 25, "img": "https://images.unsplash.com/pho let active = menuData[0].c;
let searchQ = "";
function getCart(){return JSON.parse(localStorage.getItem('tahey_cart')||'[]')}
function saveCart(c){localStorage.setItem('tahey_cart',JSON.stringify(c));updateCount()}
function updateCount(){let el=document.getElementById('cartCount');if(el) el.innerText=getCart().reduce((a,b)=>a+b.q,0)}
function renderCats(){
  document.getElementById('cats').innerHTML = menuData.map(m=>`<div class="catItem ${m.c==active?'active':''}" onclick="setCat('${m.c}')"><div style="font-size:22px">${m.ico}</div><div style="font-size:10px;font-weight:700;margin-top:4px">${m.c}</div></div>`).join('');
}
function setCat(c){active=c;searchQ='';document.getElementById('searchInput').value='';renderCats();renderMenu()}
function renderMenu(){
  let container = document.getElementById('menuSection');
  let html = '';
  let catsToShow = searchQ ? menuData : menuData.filter(m=>m.c==active);
  catsToShow.forEach(cat=>{
    let items = cat.items;
    if(searchQ){items = cat.items.filter(it=>it.n.includes(searchQ)); if(items.length==0) return;}
    html += `<div class="sectionHeader"><h2>${cat.ico} ${cat.c}</h2><span class="count">${items.length} صنف</span></div><div class="list">`;
    html += items.map(it=>{
      let shortName = it.n.split(' - ')[0];
      let desc = it.n.includes(' - ') ? it.n.split(' - ').slice(1).join(' - ') : '';
      return `<div class="itemRow"><img src="${it.img}" loading="lazy"><div class="itemInfo"><h4>${shortName}</h4>${desc?`<p>${desc}</p>`:''}</div><div class="itemAction"><span class="price">${it.p} ج</span><button class="addBtn" onclick="addToCart('${it.n.replace("'", "")}','${it.img}',${it.p})">+</button></div></div>`;
    }).join('');
    html += `</div>`;
  });
  if(html=='') html = `<div style="text-align:center;padding:40px;color:#777">مفيش نتائج لـ "${searchQ}"</div>`;
  container.innerHTML = html;
}
function filterSearch(){searchQ=document.getElementById('searchInput').value.trim(); if(searchQ){active='';renderCats()} else {active=menuData[0].c;renderCats()} renderMenu()}
function addToCart(name,img,price){let c=getCart();let f=c.find(x=>x.name==name);if(f) f.q++; else c.push({name,price,q:1,img});saveCart(c);}
renderCats();renderMenu();updateCount();
</script>
</body>
</html>
