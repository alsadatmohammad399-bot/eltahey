let cart=[],cur=null,q=1,fil='الكل';
function render(){let g=document.getElementById('grid');let L=fil==='الكل'?P:P.filter(x=>x.c===fil);g.innerHTML=L.map(p=>`<div class="card-dark rounded-[16px] overflow-hidden cursor-pointer" onclick="openP(${p.id})"><div class="relative h-[130px]"><img src="${p.i}" class="w-full h-full object-cover"><span class="absolute bottom-1 left-1 bg-black/70 px-2 py-1 rounded-full text-[8px]">${p.c}</span></div><div class="p-2"><div class="font-bold text-[10px] h-[28px]">${p.t}</div><div class="flex justify-between mt-1"><span class="text-[#FF6A00] font-black text-[11px]">${p.p} ج</span><div class="w-6 h-6 bg-[#FF6A00] rounded-full grid place-items-center text-black text-[10px]">+</div></div></div></div>`).join('')}
function openP(id){cur=P.find(x=>x.id===id);q=1;document.getElementById('mImg').src=cur.i;document.getElementById('mTitle').innerText=cur.t;document.getElementById('mPrice').innerText=cur.p+' ج';upd();document.getElementById('modal').classList.remove('hidden')}
function closeModal(){document.getElementById('modal').classList.add('hidden')}
function chg(d){q=Math.max(1,q+d);upd()}
function upd(){document.getElementById('mQty').innerText=q;document.getElementById('mTotal').innerText=(cur.p*q)+' ج'}
function addCart(){let e=cart.find(x=>x.id===cur.id);if(e)e.qty+=q;else cart.push({...cur,qty:q});updateCart();closeModal()}
function updateCart(){document.getElementById('cartBadge').innerText=cart.reduce((s,c)=>s+c.qty,0);document.getElementById('cartItems').innerHTML=cart.map((c,i)=>`<div class="flex gap-2 bg-[#1E1E20] p-2 rounded-xl"><img src="${c.i}" class="w-10 h-10 rounded-full object-cover"><div class="flex-1"><div class="text-[10px] font-bold">${c.t}</div><div class="text-[9px] text-white/40">${c.p} × ${c.qty}</div></div><button onclick="cart.splice(${i},1);updateCart()">✕</button></div>`).join('')||'<div class="text-center text-white/30 text-[11px] py-6">فاضي</div>';document.getElementById('cartTotal').innerText=cart.reduce((s,c)=>s+c.p*c.qty,0)+' ج'}
function openCart(){document.getElementById('cartDrawer').classList.remove('hidden')}
function closeCart(){document.getElementById('cartDrawer').classList.add('hidden')}
function filterCat(c){fil=c;document.querySelectorAll('.filter-btn').forEach(b=>b.classList.toggle('filter-active',b.dataset.cat===c));render()}
function checkout(){if(!cart.length)return alert('فاضي');let n=document.getElementById('custName').value;let ph=document.getElementById('custPhone').value;let ad=document.getElementById('custAddress').value;let no=document.getElementById('custNotes').value;if(!n||!ph||!ad)return alert('اكمل البيانات');let m=`طلب - ${n} - ${ph} - ${ad}%0A`;if(no)m+=`ملاحظات:${no}%0A`;cart.forEach(c=>m+=`- ${c.t} × ${c.qty} = ${c.p*c.qty}ج%0A`);m+=`المجموع: ${cart.reduce((s,c)=>s+c.p*c.qty,0)}ج`;window.open(`https://wa.me/201140243713?text=${m}`,'_blank')}
render();updateCart();
