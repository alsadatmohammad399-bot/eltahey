<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>الطاهي</title><script src="https://cdn.tailwindcss.com"></script><link href="https://fonts.googleapis.com/css2?family=Cairo:wght@700;900&display=swap" rel="stylesheet"><style>body{font-family:Cairo}</style></head>
<body class="bg-[#1a1a1a] text-white">
<header class="bg-gradient-to-r from-orange-600 to-red-600 p-5 sticky top-0 z-20 flex justify-between max-w-6xl mx-auto"><h1 class="text-2xl font-black">🔥 الطاهي</h1><button onclick="toggleCart()" class="bg-black px-5 py-2 rounded-full font-bold">🛒 <span id="cart-count">0</span></button></header>
<div class="max-w-6xl mx-auto p-4"><div id="menu" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-4 mt-6"></div></div>
<div id="cart-modal" class="hidden fixed inset-0 bg-black/80 flex items-center justify-center p-4 z-30"><div class="bg-white text-black rounded-[24px] p-6 w-full max-w-md"><h2 class="text-2xl font-black">سلة الطلب</h2><div id="cart-items" class="my-4"></div><div class="flex justify-between font-black text-xl"><span>الإجمالي</span><span id="cart-total">0ج</span></div><input id="cust-name" placeholder="الاسم" class="w-full border-2 p-3 rounded-xl mt-4"><input id="cust-phone" placeholder="الموبايل" class="w-full border-2 p-3 rounded-xl mt-2"><input id="cust-address" placeholder="العنوان" class="w-full border-2 p-3 rounded-xl mt-2"><button onclick="confirmOrder()" class="w-full bg-orange-600 text-white py-4 rounded-xl mt-4 font-black">تأكيد الطلب</button><button onclick="toggleCart()" class="w-full mt-2 text-gray-400">إغلاق</button></div></div>
<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
import { getFirestore, collection, addDoc, getDocs, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";
const firebaseConfig = { apiKey: "AIzaSyArvJ3bcXrqnRXBW8Pr_hH1Ok-Me3hwdcQ", authDomain: "eltahey-1dadd.firebaseapp.com", projectId: "eltahey-1dadd", storageBucket: "eltahey-1dadd.firebasestorage.app", messagingSenderId: "998375782695", appId: "1:998375782695:web:87c49667b00c6459b39102" };
const app = initializeApp(firebaseConfig); const db = getFirestore(app);
let products=[]; let cart=[];
async function loadMenu(){
  const snap = await getDocs(collection(db,'products'));
  products = []; snap.forEach(d=>products.push({id:d.id,...d.data()}));
  const menuDiv = document.getElementById('menu'); menuDiv.innerHTML=''; let cur=''; products.sort((a,b)=>a.cat.localeCompare(b.cat)).forEach(p=>{ if(p.cat!==cur){ cur=p.cat; menuDiv.innerHTML+=`<div class="col-span-full mt-4"><h3 class="text-xl font-black text-orange-500 border-r-4 border-orange-500 pr-3">${cur}</h3></div>`;} menuDiv.innerHTML+=`<div class="bg-[#252525] rounded-[20px] p-5 flex justify-between items-center border border-white/10"><div class="flex gap-3 items-center"><div class="text-3xl bg-[#333] w-12 h-12 rounded-full flex items-center justify-center">${p.emoji||'🔥'}</div><div><h3 class="font-bold">${p.name}</h3><p class="text-orange-400 font-black">${p.price}ج</p></div></div><button onclick="addToCart('${p.id}')" class="bg-white text-black w-10 h-10 rounded-full font-black text-xl">+</button></div>`; });
  if(products.length==0) menuDiv.innerHTML='<p class="col-span-full text-center text-white/40 py-20">المطعم بيجهز المنيو حالاً.. ارجع كمان شوية</p>';
}
window.addToCart = (id) => { const item = products.find(i=>i.id==id); const ex = cart.find(c=>c.id==id); if(ex) ex.qty++; else cart.push({...item,qty:1}); updateCart(); }
window.updateCart = () => { document.getElementById('cart-count').innerText=cart.reduce((s,i)=>s+i.qty,0); document.getElementById('cart-items').innerHTML=cart.map(i=>`<div class="flex justify-between bg-gray-50 p-2 rounded-xl"><span>${i.name} x${i.qty}</span><span>${i.price*i.qty}ج</span></div>`).join(''); document.getElementById('cart-total').innerText=cart.reduce((s,i)=>s+i.price*i.qty,0)+' جنيه'; }
window.toggleCart = () => document.getElementById('cart-modal').classList.toggle('hidden');
window.confirmOrder = async () => { const name=document.getElementById('cust-name').value.trim(); const phone=document.getElementById('cust-phone').value.trim(); const address=document.getElementById('cust-address').value.trim(); if(!name||!phone||cart.length==0) return alert('كمل بياناتك'); const total=cart.reduce((s,i)=>s+i.price*i.qty,0); await addDoc(collection(db,'orders'),{customerName:name,phone,address,items:cart,total,status:'جديد',createdAt:serverTimestamp()}); alert('تم الطلب 🔥'); cart=[]; updateCart(); toggleCart(); }
loadMenu();
</script>
</body>
</html>
