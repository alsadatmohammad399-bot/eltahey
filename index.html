<body class="bg-[#0f0f0f] text-white">

<header class="bg-gradient-to-r from-orange-600 to-red-600 p-4 sticky top-0 z-20">

<div class="flex justify-between items-center">
<h1 class="text-2xl font-black">🔥 الطاهي ELTAHEY</h1>
<button onclick="toggleCart()" class="bg-black px-6 py-2.5 rounded-full font-black">🛒 السلة <span id="cart-count" class="bg-orange-500 px-2 rounded-full mr-1">0</span></button>
</div>
<div id="cats" class="flex gap-2 overflow-x-auto no-scroll mt-4 pb-1"></div>
</div>
</header>

<div class="max-w-7xl mx-auto p-4">
<div id="menu" class="space-y-8"></div>
</div>

<div id="cart-modal" class="hidden fixed inset-0 bg-black/80 z-30 flex items-end md:items-center justify-center p-0 md:p-4">
<div class="bg-white text-black rounded-t-[28px] md:rounded-[28px] w-full max-w-md max-h-[90vh] overflow-auto p-6">
<div class="flex justify-between items-center"><h2 class="text-2xl font-black">🛒 طلبك</h2><button onclick="toggleCart()" class="text-2xl">✕</button></div>
<div id="cart-items" class="my-4 space-y-2"></div>
<div class="flex justify-between font-black text-xl border-t pt-3"><span>الإجمالي</span><span id="cart-total">0 جنيه</span></div>
<input id="cust-name" placeholder="الاسم" class="w-full border-2 border-gray-200 p-3 rounded-xl mt-4 outline-none focus:border-orange-500">
<input id="cust-phone" placeholder="رقم الموبايل" class="w-full border-2 border-gray-200 p-3 rounded-xl mt-2 outline-none focus:border-orange-500">
<input id="cust-address" placeholder="العنوان - المنطقة - علامة مميزة" class="w-full border-2 border-gray-200 p-3 rounded-xl mt-2 outline-none focus:border-orange-500">
<button onclick="confirmOrder()" class="w-full bg-gradient-to-r from-orange-600 to-red-600 text-white py-4 rounded-xl mt-4 font-black text-lg">تأكيد الطلب الآن 🔥</button>
</div>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
import { getFirestore, collection, addDoc, getDocs, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";
const firebaseConfig={apiKey:"AIzaSyArvJ3bcXrqnRXBW8Pr_hH1Ok-Me3hwdcQ",authDomain:"eltahey-1dadd.firebaseapp.com",projectId:"eltahey-1dadd",storageBucket:"eltahey-1dadd.firebasestorage.app",messagingSenderId:"998375782695",appId:"1:998375782695:web:87c49667b00c6459b39102"};
const app=initializeApp(firebaseConfig); const db=getFirestore(app);

const baseProducts=[
["المشويات","كيلو كباب ضاني بلدي",1100,"🥩"],["المشويات","كيلو كباب كندوز",950,"🍖"],["المشويات","كيلو كفتة ضاني",650,"🔥"],["المشويات","كيلو كفتة كندوز",550,"🍢"],["المشويات","كيلو ريش ضاني",1200,"🥩"],["المشويات","كيلو طرب ضاني",700,"🔥"],["المشويات","كيلو كباب و كفتة ميكس",850,"🍖"],["المشويات","كيلو سجق بلدي مشوي",400,"🌭"],["المشويات","كيلو شيش كباب",600,"🍢"],["المشويات","وجبة مشويات فرد",350,"🔥"],["المشويات","وجبة مشويات عائلي 4 افراد",1250,"🍱"],["المشويات","وجبة مشويات سوبر 6 افراد",1850,"🍱"],
["الفراخ","فرخة مشوية فحم كاملة",350,"🍗"],["الفراخ","نص فرخة مشوية",185,"🍗"],["الفراخ","فرخة شيش طاووق",380,"🍢"],["الفراخ","كيلو شيش طاووق مخلي",400,"🍢"],["الفراخ","فرخة محمرة",340,"🍗"],["الفراخ","فراخ مسحب",360,"🍗"],["الفراخ","وجبة فرخة + أرز + سلطة",420,"🍱"],["الفراخ","كوردن بلو فراخ",280,"🍗"],
["الطواجن","طاجن لحمة بالبصل",280,"🍲"],["الطواجن","طاجن كوارع",320,"🍲"],["الطواجن","طاجن ورق عنب بالكوارع",350,"🍲"],["الطواجن","طاجن عكاوي",380,"🍲"],["الطواجن","طاجن لحمة ضاني",350,"🍲"],["الطواجن","طاجن بامية باللحمة",220,"🍲"],["الطواجن","طاجن ملوخية باللحمة",200,"🍲"],["الطواجن","طاجن لسان عصفور بالكبدة",180,"🍲"],["الطواجن","طاجن فريك باللحمة",200,"🍲"],["الطواجن","طاجن مكرونة بشاميل لحمة",180,"🍲"],["الطواجن","طاجن مكرونة بشاميل فراخ",160,"🍲"],
["السندوتشات","سندوتش كباب",95,"🥙"],["السندوتشات","سندوتش كفتة",65,"🥙"],["السندوتشات","سندوتش طرب",85,"🥙"],["السندوتشات","سندوتش سجق",45,"🥙"],["السندوتشات","سندوتش شيش طاووق",55,"🥙"],["السندوتشات","سندوتش شاورما لحمة",70,"🥙"],["السندوتشات","سندوتش شاورما فراخ",60,"🥙"],["السندوتشات","سندوتش كبدة",35,"🥙"],["السندوتشات","سندوتش مخ",50,"🥙"],["السندوتشات","سندوتش كفتة داوود باشا",55,"🥙"],
["الأرز والمكرونة","أرز بسمتي سادة",60,"🍚"],["الأرز والمكرونة","أرز بسمتي بالمكسرات",90,"🍚"],["الأرز والمكرونة","أرز عادي",40,"🍚"],["الأرز والمكرونة","مكرونة محمرة",45,"🍝"],["الأرز والمكرونة","أرز بالخلطة",80,"🍚"],["الأرز والمكرونة","طاجن أرز معمر",120,"🍚"],
["السلطات","سلطة خضراء",30,"🥗"],["السلطات","سلطة طحينة",25,"🥗"],["السلطات","تومية",25,"🥣"],["السلطات","سلطة كول سلو",35,"🥗"],["السلطات","مخلل مشكل",25,"🥒"],["السلطات","بتنجان مخلل",25,"🍆"],["السلطات","بابا غنوج",40,"🥗"],["السلطات","متبل",40,"🥗"],["السلطات","سلطة زبادي",30,"🥣"],["السلطات","خضار مشوي",60,"🥗"],
["المشروبات","مياه صغيرة",10,"💧"],["المشروبات","مياه كبيرة",15,"💧"],["المشروبات","بيبسي / كولا",25,"🥤"],["المشروبات","عصير برتقال فريش",60,"🍊"],["المشروبات","عصير مانجو فريش",70,"🥭"],["المشروبات","شاي",20,"☕"],
["الحلو","رز بلبن",40,"🍮"],["الحلو","أم علي",65,"🍮"],["الحلو","كنافة",50,"🥧"],["الحلو","بسبوسة",45,"🍰"],["الحلو","سلطة فواكه",80,"🍉"],
["وجبات الطاهي","عرض الصحاب 2 كفتة + 2 كباب + رز + سلطات",550,"🔥"],["وجبات الطاهي","عرض العيلة 4 مشويات + 2 فرخة + رز",1450,"🍱"],["وجبات الطاهي","عرض اللمة 6 كيلو مشكل",2850,"🎉"],["وجبات الطاهي","وجبة فرد الطاهي المميز",220,"⭐"],["وجبات الطاهي","وجبة دبل طاهي",380,"⭐⭐"]
].map((x,i)=>({id:'base_'+i,cat:x[0],name:x[1],price:x[2],emoji:x[3]}));

let extraProducts=[]; let allProducts=[]; let cart=[]; let activeCat='الكل';
async function init(){
try{const snap=await getDocs(collection(db,'products')); snap.forEach(d=>extraProducts.push({id:d.id,...d.data()}));}catch(e){}
allProducts=[...baseProducts,...extraProducts];
renderCats(); renderMenu();
}
function renderCats(){
const cats=['الكل',...new Set(allProducts.map(p=>p.cat))];
document.getElementById('cats').innerHTML=cats.map(c=>`<button onclick="filterCat('${c}')" class="px-5 py-2 rounded-full whitespace-nowrap font-bold transition ${activeCat==c?'bg-white text-black':'bg-black/30 text-white'}">${c}</button>`).join('');
}
window.filterCat=(c)=>{activeCat=c; renderCats(); renderMenu();}
function renderMenu(){
const catsToShow = activeCat=='الكل' ? [...new Set(allProducts.map(p=>p.cat))] : [activeCat];
const container=document.getElementById('menu'); container.innerHTML='';
catsToShow.forEach(cat=>{
const items = allProducts.filter(p=>p.cat==cat);
container.innerHTML+=`<div><h2 class="text-2xl font-black text-orange-500 border-r-4 border-orange-500 pr-3 mb-4">${cat} <span class="text-white/30 text-sm font-normal">(${items.length})</span></h2><div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-3">${items.map(p=>`
<div class="bg-[#1e1e1e] rounded-2xl p-4 flex justify-between items-center border border-white/5 hover:border-orange-500/30 transition">
<div class="flex gap-3 items-center"><div class="w-12 h-12 bg-[#2a2a2a] rounded-full flex items-center justify-center text-2xl">${p.emoji}</div><div><h3 class="font-bold text-[15px]">${p.name}</h3><p class="text-orange-400 font-black text-sm mt-1">${p.price} جنيه</p></div></div>
<button onclick="addToCart('${p.id}')" class="bg-white text-black w-9 h-9 rounded-full font-black text-xl hover:bg-orange-500 hover:text-white">+</button>
</div>`).join('')}</div></div>`;
});
}
window.addToCart=(id)=>{const item=allProducts.find(i=>i.id==id); const ex=cart.find(c=>c.id==id); if(ex) ex.qty++; else cart.push({...item,qty:1}); updateCart(); if(cart.length==1) toggleCart();}
window.updateCart=()=>{document.getElementById('cart-count').innerText=cart.reduce((s,i)=>s+i.qty,0); document.getElementById('cart-items').innerHTML=cart.map(i=>`<div class="flex justify-between bg-gray-50 p-3 rounded-xl text-sm"><span>${i.name} x${i.qty}</span><span class="font-bold">${i.price*i.qty}ج</span></div>`).join('')||'<p class="text-center text-gray-400 py-4">السلة فاضية</p>'; document.getElementById('cart-total').innerText=cart.reduce((s,i)=>s+i.price*i.qty,0)+' جنيه';}
window.toggleCart=()=>document.getElementById('cart-modal').classList.toggle('hidden');
window.confirmOrder=async()=>{
const name=document.getElementById('cust-name').value.trim(); const phone=document.getElementById('cust-phone').value.trim(); const address=document.getElementById('cust-address').value.trim();
if(!name||!phone||cart.length==0) return alert('اكمل بياناتك وضيف أكل');
const total=cart.reduce((s,i)=>s+i.price*i.qty,0);
try{await addDoc(collection(db,'orders'),{customerName:name,phone,address,items:cart,total,status:'جديد',createdAt:serverTimestamp()}); alert('تم استلام طلبك يا '+name+' 🔥'); cart=[]; updateCart(); toggleCart();}catch(e){alert(e.message);}
}
init();
</script>
</body>
</html>
