let extra=[]; let all=[]; let cart=[]; let active='الكل';
async function init(){try{const s=await getDocs(collection(db,'products')); s.forEach(d=>extra.push({id:d.id,...d.data()}));}catch(e){} all=[...baseProducts,...extra]; renderCats(); renderMenu();}
function renderCats(){const cats=['الكل',...new Set(all.map(p=>p.cat))]; document.getElementById('cats').innerHTML=cats.map(c=>`<button onclick="filterCat('${c}')" class="px-6 py-2.5 rounded-full whitespace-nowrap font-black text-sm ${active==c?'bg-[#FFD700] text-black':'bg-[#222] text-white border border-white/10'}">${c}</button>`).join('');}
window.filterCat=(c)=>{active=c; renderCats(); renderMenu();}
function renderMenu(){
const catsToShow = active=='الكل'? [...new Set(all.map(p=>p.cat))] : [active];
const cont=document.getElementById('menu'); cont.innerHTML='';
catsToShow.forEach(cat=>{
const items=all.filter(p=>p.cat==cat);
cont.innerHTML+=`
<div>
<div class="flex items-center gap-3 mb-4">

window.addToCart=(id)=>{const it=all.find(i=>i.id==id); const ex=cart.find(c=>c.id==id); if(ex) ex.qty++; else cart.push({...it,qty:1}); updateCart(); if(cart.length==1) toggleCart();}
window.updateCart=()=>{document.getElementById('cart-count').innerText=cart.reduce((s,i)=>s+i.qty,0); document.getElementById('cart-items').innerHTML=cart.map(i=>`<div class="flex justify-between bg-gray-100 p-3 rounded-xl"><span class="font-bold text-sm">${i.name} x${i.qty}</span><span class="font-black">${i.price*i.qty}ج</span></div>`).join('')||'<p class="text-center text-gray-400 py-4">السلة فاضية</p>'; document.getElementById('cart-total').innerText=cart.reduce((s,i)=>s+i.price*i.qty,0)+' جنيه';}
window.toggleCart=()=>document.getElementById('cart-modal').classList.toggle('hidden');
window.confirmOrder=async()=>{const n=document.getElementById('cust-name').value.trim(); const ph=document.getElementById('cust-phone').value.trim(); const ad=document.getElementById('cust-address').value.trim(); if(!n||!ph||cart.length==0) return alert('كمل بياناتك'); const total=cart.reduce((s,i)=>s+i.price*i.qty,0); await addDoc(collection(db,'orders'),{customerName:n,phone:ph,address:ad,items:cart,total,status:'جديد',createdAt:serverTimestamp()}); alert('تم طلبك يا '+n+' 🔥'); cart=[]; updateCart(); toggleCart();}
