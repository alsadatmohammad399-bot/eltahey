let cart=[],cur=null,q=1,fil='الكل',sea='';
function render(){let g=document.getElementById('grid');let L=fil==='الكل'?P:P.filter(x=>x.c===fil);if(sea)L=L.filter(x=>x.t.includes(sea)||x.d.includes(sea));g.innerHTML=L.map(p=>`<div class="card-dark rounded-[18px] overflow-hidden cursor-pointer" onclick="openP(${p.id})"><div class="relative h-[125px]"><img src="${p.i}" class="w-full h-full object-cover">${p.b?`<span class="absolute top-2 right-2 bg-[#C6FF00] text-black text-[8px] font-black px-2 py-1 rounded-full">${p.b}</span>`:''}<span class="absolute bottom-2 left-2 bg-black/60 px-2 py-1 rounded-full text-[9px]">${p.c}</span></div><div class="p-2.5"><div class="font-bold text-[11px] h-[30px] leading-tight">${p.t}</div><div class="text-[9px] text-white/40 h-[12px]">${p.d}</div><div class="flex justify-between items-center mt-2"><span class="text-[#FF6A00] font-black text-[12px]">${p.p} ج</span><div class="w-6 h-6 bg-[#FF6A00] rounded-full grid place-items-center text-black font-black">+</div></div></div></div>`).join('')}
function openP(id){cur=P.find(x=>x.id===id);q=1;document.getElementById('mImg').src=cur.i;document.getElementById('mTitle').innerText=cur.t;document.getElementById('mDesc').innerText=cur.d;document.getElementById('mPrice').innerText=cur.p+' ج';upd();document.getElementById('modal').classList.remove('hidden')}
function closeModal(){document.getElementById('modal').classList.add('hidden')}
function chg(d){q=Math.max(1,q+d);upd()}
function upd(){document.getElementById('mQty').innerText=q;document.getElementById('mTotal').innerText=(cur.p*q)+' ج'}
function addCart(){let e=cart.find(x=>x.id===cur.id);if(e)e.qty+=q;else cart.push({...cur,qty:q});updateCart();closeModal()}
function updateCart(){document.getElementById('cartBadge').innerText=cart.reduce((s,c)=>s+c.qty,0);let c2=document.getElementById('cartCount2');if(c2)c2.innerText=cart.reduce((s,c)=>s+c.qty,0)+' صنف';document.getElementById('cartItems').innerHTML=cart.map((c,i)=>`<div class="flex gap-3 bg-[#1E1E20] p-2.5 rounded-xl"><img src="${c.i}" class="w-10 h-10 rounded-full object-cover"><div class="flex-1"><div class="text-[11px] font-bold">${c.t}</div><div class="text-[9px] text-white/40">${c.p} ج × ${c.qty}</div></div><button onclick="cart.splice(${i},1);updateCart()" class="text-white/30">✕</button></div>`).join('')||'<div class="text-center text-white/30 text-[11px] py-6">السلة فاضية</div>';document.getElementById('cartTotal').innerText=cart.reduce((s,c)=>s+c.p*c.qty,0)+' ج'}
function openCart(){document.getElementById('cartDrawer').classList.remove('hidden')}
function closeCart(){document.getElementById('cartDrawer').classList.add('hidden')}
function filterCat(c){fil=c;document.querySelectorAll('.filter-btn').forEach(b=>b.classList.toggle('filter-active',b.dataset.cat===c));render()}
function searchProducts(){sea=document.getElementById('searchInput').value;render()}
function checkout(){
if(!cart.length)return alert('السلة فاضية');
let n=document.getElementById('custName').value.trim();
let ph=document.getElementById('custPhone').value.trim();
let ad=document.getElementById('custAddress').value.trim();
let ar=document.getElementById('custArea').value;
let ty=document.getElementById('custType').value;
let no=document.getElementById('custNotes').value.trim();
if(!n)return alert('اكتب اسمك');
if(!ph||ph.length<11)return alert('اكتب رقم موبايل صحيح 11 رقم');
if(!ad)return alert('اكتب العنوان');
let m=`طلب جديد - مطعم الطاهي 🔥%0A%0A👤 الاسم: ${n}%0A📱 الموبايل: ${ph}%0A📍 المنطقة: ${ar||'غير محددة'}%0A🏠 العنوان: ${ad}%0A🚚 النوع: ${ty}%0A`;
if(no)m+=`📝 ملاحظات: ${no}%0A`;
m+=`%0A--- الطلب ---%0A`;
cart.forEach(c=>m+=`- ${c.t} × ${c.qty} = ${c.p*c.qty}ج%0A`);
m+=`%0A💰 المجموع: ${cart.reduce((s,c)=>s+c.p*c.qty,0)}ج%0A⏰ ${new Date().toLocaleString('ar-EG')}`;
window.open(`https://wa.me/201140243713?text=${m}`,'_blank');
}
render();updateCart();
</script>
