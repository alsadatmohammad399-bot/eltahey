<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>الطاهي</title>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700;800&family=Playfair+Display:ital,wght@0,700;1,700&display=swap" rel="stylesheet">
<script src="https://cdn.tailwindcss.com"></script>
<style>
:root{--black:#080808;--card:#141414;--gold:#C9A86A;--gold2:#E6C78A}
body{font-family:'Cairo';background:var(--black);color:#EAE6DF}
.playfair{font-family:'Playfair Display'}
.pill-card{width:148px;position:relative;padding-top:60px;cursor:pointer;transition:.4s}
.pill-card:hover{transform:translateY(-6px)}
.pill-img{position:absolute;top:0;left:50%;transform:translateX(-50%);width:96px;height:96px;border-radius:50%;border:2px solid var(--gold);object-fit:cover;box-shadow:0 0 0 4px rgba(201,168,106,.15)}
.pill-line{position:absolute;top:60px;left:50%;width:1px;height:28px;background:linear-gradient(to bottom, var(--gold), transparent)}
.pill-body{background:#141414;border:1px solid rgba(201,168,106,.18);border-radius:80px;padding:50px 10px 22px;text-align:center}
.pill-title{color:var(--gold);font-weight:800;font-size:13px}
.pill-icon{position:absolute;bottom:-12px;left:50%;transform:translateX(-50%);width:32px;height:32px;background:var(--gold);color:#000;border-radius:50%;display:grid;place-items:center;font-weight:900}
.modal-bg{backdrop-filter:blur(12px);background:rgba(0,0,0,.75)}
</style>
</head>
<body>

<header class="sticky top-0 z-40 bg-[#080808]/80 backdrop-blur-xl border-b border-white/5 px-6 md:px-12 py-4 flex justify-between items-center">
<div class="flex items-center gap-3"><div class="w-9 h-9 rounded-full bg-[#C9A86A] text-black grid place-items-center font-bold">T</div><div class="playfair text-xl">EL <span class="text-[#C9A86A] italic">TAHEY</span></div></div>
<div class="flex items-center gap-3">
<button onclick="openCart()" class="relative bg-white/10 px-5 py-2 rounded-full text-[12px]">🛒 السلة <span id="cartCount" class="absolute -top-2 -right-2 bg-[#C9A86A] text-black w-5 h-5 rounded-full text-[10px] grid place-items-center font-bold hidden">0</span></button>
<button class="bg-[#C9A86A] text-black px-5 py-2 rounded-full text-[11px] font-bold">احجز طاولة</button>
</div>
</header>

<!-- FILTER -->
<div class="px-6 md:px-12 py-6 flex gap-2 overflow-x-auto" id="filterBar">
<button onclick="filterCat('all')" class="filter-btn active bg-[#C9A86A] text-black px-4 py-2 rounded-full text-[11px] font-bold" data-cat="all">الكل</button>
<button onclick="filterCat('كباب')" class="filter-btn bg-white/5 px-4 py-2 rounded-full text-[11px]" data-cat="كباب">كباب</button>
<button onclick="filterCat('ريش')" class="filter-btn bg-white/5 px-4 py-2 rounded-full text-[11px]" data-cat="ريش">ريش</button>
<button onclick="filterCat('طرب')" class="filter-btn bg-white/5 px-4 py-2 rounded-full text-[11px]" data-cat="طرب">طرب</button>
<button onclick="filterCat('كفتة')" class="filter-btn bg-white/5 px-4 py-2 rounded-full text-[11px]" data-cat="كفتة">كفتة</button>
<button onclick="filterCat('موزة')" class="filter-btn bg-white/5 px-4 py-2 rounded-full text-[11px]" data-cat="موزة">موزة</button>
<button onclick="filterCat('حواوشي')" class="filter-btn bg-white/5 px-4 py-2 rounded-full text-[11px]" data-cat="حواوشي">حواوشي</button>
<button onclick="filterCat('فراخ')" class="filter-btn bg-white/5 px-4 py-2 rounded-full text-[11px]" data-cat="فراخ">فراخ</button>
<button onclick="filterCat('ميكس')" class="filter-btn bg-white/5 px-4 py-2 rounded-full text-[11px]" data-cat="ميكس">ميكس جريل</button>
</div>

<!-- PRODUCTS GRID - PILL STYLE -->
<div class="px-6 md:px-12 pb-20">
<div id="productsGrid" class="flex gap-6 flex-wrap justify-start"></div>
</div>

<!-- PRODUCT MODAL -->
<div id="productModal" class="fixed inset-0 z-50 hidden">
<div class="modal-bg absolute inset-0" onclick="closeModal()"></div>
<div class="relative max-w-[520px] mx-auto mt-[10vh] bg-[#141414] border border-[#C9A86A]/20 rounded-[28px] overflow-hidden m-4">
<button onclick="closeModal()" class="absolute top-4 left-4 w-8 h-8 bg-white/10 rounded-full">✕</button>
<img id="modalImg" class="w-full h-[280px] object-cover">
<div class="p-7">
<div class="flex justify-between items-start">
<div><h3 id="modalTitle" class="playfair text-[22px] font-bold"></h3><p id="modalSub" class="text-white/40 text-[12px] mt-1"></p></div>
<div id="modalPrice" class="text-[#C9A86A] font-bold text-[20px]"></div>
</div>
<p class="text-white/50 text-[13px] mt-4 leading-relaxed">لحم بلدي طازج يوم بيوم، متبل بخلطة الطاهي السرية و مشوي على فحم برتقال طبيعي. بيجي مع عيش بلدي، طحينة، وسلطة خضرا.</p>
<div class="flex items-center gap-3 mt-6">
<div class="flex items-center gap-2 bg-black border border-white/10 rounded-full px-2">
<button onclick="changeQty(-1)" class="w-8 h-8">-</button><span id="modalQty" class="w-6 text-center">1</span><button onclick="changeQty(1)" class="w-8 h-8">+</button>
</div>
<button onclick="addToCartFromModal()" class="flex-1 bg-[#C9A86A] text-black py-3 rounded-full font-bold text-[13px]">أضف للسلة - <span id="modalTotalPrice"></span></button>
</div>
</div>
</div>
</div>

<!-- CART DRAWER -->
<div id="cartDrawer" class="fixed inset-0 z-[60] hidden">
<div class="absolute inset-0 bg-black/60" onclick="closeCart()"></div>
<div class="absolute left-0 top-0 h-full w-[92%] max-w-[400px] bg-[#0F0F0F] border-r border-[#C9A86A]/20 p-6 flex flex-col">
<div class="flex justify-between items-center"><h3 class="font-bold text-[18px]">سلة الطلبات</h3><button onclick="closeCart()" class="w-8 h-8 bg-white/10 rounded-full">✕</button></div>
<div id="cartItems" class="flex-1 overflow-y-auto mt-6 space-y-4"></div>
<div class="border-t border-white/10 pt-4 mt-4">
<div class="flex justify-between text-[13px]"><span class="text-white/40">المجموع</span><span id="cartTotal" class="text-[#C9A86A] font-bold">0 ج</span></div>
<button onclick="checkout()" class="w-full mt-4 bg-[#C9A86A] text-black py-3 rounded-full font-bold">تأكيد الطلب واتساب</button>
</div>
</div>
</div>

<script>
const products = [
{id:1,cat:'كباب',title:'كباب ضاني بلدي',sub:'350جم لحم بلدي',price:420,img:'https://images.unsplash.com/photo-1529193591184-b1d58069ecdd?w=500'},
{id:2,cat:'كباب',title:'كباب كندوز',sub:'400جم كندوز فاخر',price:390,img:'https://images.unsplash.com/photo-1546964124-0c84906bbb8b?w=500'},
{id:3,cat:'ريش',title:'ريش ضاني مشوية',sub:'6 قطع ريش بلدي',price:480,img:'https://images.unsplash.com/photo-1546964052-d9334ceb32ee?w=500'},
{id:4,cat:'ريش',title:'ريش كندوز',sub:'5 قطع فحم',price:450,img:'https://images.unsplash.com/photo-1529193591184-b1d58069ecdd?w=500'},
{id:5,cat:'طرب',title:'طرب بلدي',sub:'خلطة الطاهي الدهبي',price:380,img:'https://images.unsplash.com/photo-1558030006-450066393d65?w=500'},
{id:6,cat:'طرب',title:'طرب ضاني',sub:'ملفوف منديل',price:400,img:'https://images.unsplash.com/photo-1544025162-d76694265947?w=500'},
{id:7,cat:'كفتة',title:'كفتة الطاهي',sub:'خلطة سرية 22 سنة',price:320,img:'https://images.unsplash.com/photo-1565557623262-b51c2513a641?w=500'},
{id:8,cat:'كفتة',title:'كفتة داوود باشا',sub:'بصوص طماطم',price:340,img:'https://images.unsplash.com/photo-1599487488170-d11ec9c172f0?w=500'},
{id:9,cat:'موزة',title:'موزة ضاني محمرة',sub:'مع رز بسمتي',price:520,img:'https://images.unsplash.com/photo-1546964052-d9334ceb32ee?w=500'},
{id:10,cat:'موزة',title:'موزة كندوز',sub:'بتستوي 6 ساعات',price:490,img:'https://images.unsplash.com/photo-1504674900247-0877df9cc836?w=500'},
{id:11,cat:'حواوشي',title:'حواوشي بلدي',sub:'عيش بلدي و سجق',price:180,img:'https://images.unsplash.com/photo-1599487488170-d11ec9c172f0?w=500'},
{id:12,cat:'حواوشي',title:'حواوشي اسكندراني',sub:'بالجبنة',price:210,img:'https://images.unsplash.com/photo-1565299624946-b28f40a0ae38?w=500'},
{id:13,cat:'فراخ',title:'فرخة مشوية كاملة',sub:'فحم + تتبيلة',price:350,img:'https://images.unsplash.com/photo-1532550907401-a500c9a57435?w=500'},
{id:14,cat:'فراخ',title:'شيش طاووق',sub:'350جم صدور',price:300,img:'https://images.unsplash.com/photo-1529193591184-b1d58069ecdd?w=500'},
{id:15,cat:'ميكس',title:'ميكس جريل عائلي',sub:'يكفي 4 أشخاص',price:950,img:'https://images.unsplash.com/photo-1544025162-d76694265947?w=500'},
{id:16,cat:'ميكس',title:'ميكس جريل فرد',sub:'كباب + كفتة + ريش',price:520,img:'https://images.unsplash.com/photo-1546964124-0c84906bbb8b?w=500'},
];

let cart=[], currentProduct=null, currentQty=1, currentFilter='all';

function renderProducts(){
const grid=document.getElementById('productsGrid');
const filtered=currentFilter==='all'?products:products.filter(p=>p.cat===currentFilter);
grid.innerHTML=filtered.map(p=>`
<div class="pill-card" onclick="openProduct(${p.id})">
<div class="pill-line"></div>
<img class="pill-img" src="${p.img}">
<div class="pill-body">
<div class="pill-title">${p.title}</div>
<div class="text-white/30 text-[10px] mt-1">${p.sub}</div>
<div class="mt-2 bg-black border border-[#C9A86A]/30 text-[#C9A86A] text-[10px] px-2 py-1 rounded-full inline-block">${p.price} ج</div>
<div class="pill-icon">+</div>
</div>
</div>
`).join('');
}

function openProduct(id){
currentProduct=products.find(p=>p.id===id);
currentQty=1;
document.getElementById('modalImg').src=currentProduct.img;
document.getElementById('modalTitle').innerText=currentProduct.title;
document.getElementById('modalSub').innerText=currentProduct.sub;
document.getElementById('modalPrice').innerText=currentProduct.price+' ج';
updateModalQty();
document.getElementById('productModal').classList.remove('hidden');
}
function closeModal(){document.getElementById('productModal').classList.add('hidden')}
function changeQty(d){currentQty=Math.max(1,currentQty+d);updateModalQty()}
function updateModalQty(){
document.getElementById('modalQty').innerText=currentQty;
document.getElementById('modalTotalPrice').innerText=(currentProduct.price*currentQty)+' ج';
}
function addToCartFromModal(){
const exist=cart.find(c=>c.id===currentProduct.id);
if(exist){exist.qty+=currentQty}else{cart.push({...currentProduct,qty:currentQty})}
updateCartUI();closeModal();
const btn=document.getElementById('cartCount');btn.classList.remove('hidden');btn.animate([{transform:'scale(1.4)'},{transform:'scale(1)'}],{duration:200});
}
function updateCartUI(){
document.getElementById('cartCount').innerText=cart.reduce((s,c)=>s+c.qty,0);
document.getElementById('cartCount').classList.toggle('hidden',cart.length===0);
document.getElementById('cartItems').innerHTML=cart.map((c,i)=>`
<div class="flex gap-3 bg-[#141414] p-3 rounded-xl border border-white/5">
<img src="${c.img}" class="w-14 h-14 rounded-full object-cover">
<div class="flex-1"><div class="text-[13px] font-bold">${c.title}</div><div class="text-[11px] text-white/40">${c.price} ج × ${c.qty}</div></div>
<button onclick="removeFromCart(${i})" class="text-white/30">✕</button>
</div>
`).join('') || '<div class="text-center text-white/30 text-[13px] mt-20">السلة فاضية - دوس على أي صنف عشان تضيف</div>';
document.getElementById('cartTotal').innerText=cart.reduce((s,c)=>s+c.price*c.qty,0)+' ج';
}
function removeFromCart(i){cart.splice(i,1);updateCartUI()}
function openCart(){document.getElementById('cartDrawer').classList.remove('hidden')}
function closeCart(){document.getElementById('cartDrawer').classList.add('hidden')}
function filterCat(cat){
currentFilter=cat;
document.querySelectorAll('.filter-btn').forEach(b=>{
b.classList.toggle('bg-[#C9A86A]',b.dataset.cat===cat);
b.classList.toggle('text-black',b.dataset.cat===cat);
b.classList.toggle('bg-white/5',b.dataset.cat!==cat);
});
renderProducts();
}
function checkout(){
if(cart.length===0)return alert('السلة فاضية');
let msg='طلب جديد من موقع الطاهي:%0A';
cart.forEach(c=>{msg+=`- ${c.title} × ${c.qty} = ${c.price*c.qty}ج%0A`});
msg+=`المجموع: ${cart.reduce((s,c)=>s+c.price*c.qty,0)}ج`;
window.open(`https://wa.me/201000000000?text=${msg}`,'_blank');
}
renderProducts();updateCartUI();
</script>
</body>
</html>
