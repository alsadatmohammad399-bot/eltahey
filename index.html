<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>الطاهي | EL TAHEY</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#FFD500">
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@600;700;800;900&display=swap" rel="stylesheet">
<style>
:root{--bg:#0e0e10;--card:#1c1c1f;--yellow:#FFD500;--gray:#9a9aa0;--border:#2a2a2e}
*{margin:0;padding:0;box-sizing:border-box;font-family:'Cairo'}body{background:var(--bg);color:white;padding-bottom:80px}
.header{position:sticky;top:0;z-index:100;background:rgba(14,14,16,.98);backdrop-filter:blur(12px);padding:12px 16px;display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid var(--border)}
.logo{display:flex;gap:10px;align-items:center;font-weight:900;font-size:20px}.logo b{color:var(--yellow)}.logoIcon{width:40px;height:40px;background:linear-gradient(135deg,#FFD500,#FF8C00);border-radius:12px;display:grid;place-items:center;color:black;font-weight:900}
.cartBtn{background:var(--yellow);color:black;padding:8px 18px;border-radius:24px;font-weight:800;font-size:14px;text-decoration:none;display:flex;gap:6px;align-items:center}
.search{margin:12px 16px;background:var(--card);border:1px solid var(--border);border-radius:16px;padding:14px 16px;display:flex;gap:10px;align-items:center}
.search input{flex:1;background:transparent;border:none;color:white;outline:none;font-size:14px}
.hero{margin:12px 16px;border-radius:20px;background:linear-gradient(135deg,#1c1c1f 0%, #2a2a15 100%);padding:20px;display:flex;gap:16px;align-items:center;border:1px solid var(--border)}
.hero img{width:90px;height:90px;border-radius:16px;object-fit:cover}
.hero h2{font-size:18px;line-height:1.2}.hero h2 span{color:var(--yellow)}.hero p{font-size:11px;color:var(--gray);margin-top:4px}
.hero .btn{background:var(--yellow);color:black;border:none;padding:8px 16px;border-radius:20px;font-weight:800;font-size:12px;margin-top:8px;cursor:pointer}
.cats{display:flex;gap:10px;overflow-x:auto;padding:12px 16px;scrollbar-width:none}.cats::-webkit-scrollbar{display:none}
.cat{flex-shrink:0;background:var(--card);border:2px solid transparent;border-radius:16px;padding:12px 16px;text-align:center;min-width:80px;cursor:pointer;transition:.2s}
.cat.active{border-color:var(--yellow);background:#2a2a15}.cat .ico{font-size:26px}.cat .lbl{font-size:11px;font-weight:700;margin-top:4px}
.sectionTitle{padding:16px 16px 8px;display:flex;justify-content:space-between;align-items:center}
.sectionTitle h3{font-size:16px;font-weight:800}.sectionTitle span{font-size:11px;color:var(--gray)}
.grid{display:grid;grid-template-columns:1fr;gap:16px;padding:0 16px}
.bigCard{background:var(--card);border-radius:20px;overflow:hidden;border:1px solid var(--border);display:flex;flex-direction:column}
.bigCard .imgWrap{position:relative;height:200px;overflow:hidden}
.bigCard .imgWrap img{width:100%;height:100%;object-fit:cover;transition:.3s}
.bigCard:hover .imgWrap img{transform:scale(1.05)}
.badge{position:absolute;top:12px;right:12px;background:var(--yellow);color:black;font-size:10px;font-weight:800;padding:4px 10px;border-radius:20px}
.priceBadge{position:absolute;bottom:12px;left:12px;background:rgba(0,0,0,.85);color:var(--yellow);font-size:16px;font-weight:900;padding:6px 14px;border-radius:12px;backdrop-filter:blur(6px)}
.bigCard .info{padding:14px 16px}
.bigCard h4{font-size:16px;font-weight:800;line-height:1.3}
.bigCard p{font-size:12px;color:var(--gray);margin-top:4px;line-height:1.4}
.cardFooter{display:flex;justify-content:space-between;align-items:center;margin-top:12px}
.qtyCtrl{display:flex;align-items:center;gap:12px;background:#232326;border-radius:12px;padding:6px 10px}
.qtyCtrl button{width:32px;height:32px;border-radius:50%;border:none;font-weight:900;font-size:18px;cursor:pointer}
.qtyCtrl .minus{background:#333;color:white}.qtyCtrl .plus{background:var(--yellow);color:black}
.addBtnBig{flex:1;background:var(--yellow);color:black;border:none;padding:14px;border-radius:14px;font-weight:900;font-size:15px;cursor:pointer;display:flex;justify-content:center;gap:8px;align-items:center}
.bottomNav{position:fixed;bottom:0;left:0;right:0;background:rgba(14,14,16,.98);backdrop-filter:blur(12px);border-top:1px solid var(--border);display:flex;justify-content:space-around;padding:10px 0;z-index:200}
.bottomNav a{color:var(--gray);font-size:10px;text-decoration:none;display:flex;flex-direction:column;align-items:center;gap:4px}
.bottomNav a.active{color:var(--yellow)}.bottomNav .ico{font-size:20px}
.installBanner{margin:12px 16px;background:var(--yellow);color:black;border-radius:16px;padding:14px 16px;display:flex;justify-content:space-between;align-items:center}
.installBanner button{background:black;color:var(--yellow);border:none;padding:8px 16px;border-radius:10px;font-weight:800;cursor:pointer}
</style>
</head>
<body>
<div class="header"><div class="logo"><div class="logoIcon">ط</div><div>الطاهي <b>EL TAHEY</b></div></div><a href="cart.html" class="cartBtn">🛒 <span id="cartCount">0</span> - <span id="cartTotal">0 ج</span></a></div>
<div class="search"><span>🔍</span><input id="search" placeholder="ابحث عن كباب، كفتة، بروست..." oninput="filterSearch()"></div>
<div class="installBanner" id="installBanner"><div><b>📲 نزّل تطبيق الطاهي</b><br><small style="font-size:11px">أسرع، يشتغل بدون نت</small></div><button onclick="installApp()">تثبيت</button></div>
<div class="hero"><img src="https://images.unsplash.com/photo-1544025162-d76694265947?w=400"><div><h2>HOT KEBAB.<br><span>HAPPY MOMENTS.</span></h2><p>90 صنف مشوي على الفحم - توصيل سخن لحد بابك</p><button class="btn" onclick="document.getElementById('cats').scrollIntoView({behavior:'smooth'})">شوف المنيو ↓</button></div></div>
<div class="cats" id="cats"></div>
<div class="sectionTitle"><h3 id="currentCat">🔥 المشويات</h3><span id="count">24 صنف</span></div>
<div class="grid" id="grid"></div>
<div class="bottomNav">
<a href="#" class="active"><span class="ico">🏠</span>الرئيسية</a>
<a href="#cats"><span class="ico">📋</span>المنيو</a>
<a href="cart.html"><span class="ico">🛒</span>السلة</a>
<a href="tel:01015861991"><span class="ico">📞</span>اتصل بنا</a>
</div>
<script>
const menuData = [
{c:"المشويات",ico:"🍖",items:[["كيلو كباب ضاني",1100],["كيلو ريش ضاني",1000],["كيلو كفته كندوز",550],["كيلو كفته ضاني",600],["كيلو مشكل",800],["كيلو طرب ضاني",600],["كيلو كفته و طرب",575],["كيلو شيش طاوك",450],["كيلو استربس",470],["فرخة شيش",360],["فرخة تكا",360],["فرخة شوايه",360],["فرخة 1/2",180],["فرخة 1/4",95],["1/2 كفته كندوز",275],["1/2 كفته ضاني",300],["1/4 كفته ضاني",160],["1/4 كفته كندوز",140],["1/2 طرب ضاني",300],["1/4 طرب ضاني",160],["موزه ضاني",400],["كيلو سجق ضاني",400],["1/2 سجق ضاني",200],["1/4 سجق ضاني",110]]},
{c:"الوجبات",ico:"🍱",items:[["وجبة 1/2 فرخة - نص فرخة + أرز + خضار + سلطة",200],["وجبة 1/4 فرخة",130],["وجبة 1/2 كفته",310],["وجبة 1/4 كفته",180],["وجبة كبده اسكندراني",170],["وجبة ميكس جريل",250],["وجبة الكومبو",200],["وجبة شيش طاووق",170],["وجبة التوفير",220],["وجبة الطاهي",260],["وجبة فراخ وكفته",235]]},
{c:"السندوتشات",ico:"🥪",items:[["سندوتش كبده اسكندراني",45],["سندوتش طرب",130],["سندوتش شيش طاووق",75],["سندوتش كفته",70],["سندوتش كباب",140],["سندوتش سجق ضاني",40],["رغيف حواوشي",40],["حواوشي الطاهي",120]]},
{c:"كبده",ico:"🍛",items:[["كيلو كبده اسكندراني",400],["نص كيلو كبده",200],["ربع كيلو كبده",100],["طلب كبده",90]]},
{c:"قسم المطبخ",ico:"🍲",items:[["طاجن بطاطس (لحمه بلدي)",200],["طاجن باميه (لحمه بلدي)",200],["طاجن تورلي (لحمه بلدي)",200],["حمام محشي",180],["طبق محشي",100],["كيلو ممبار",250],["نص ممبار",200],["ربع ممبار",170]]},
{c:"طلب كفته",ico:"🥙",items:[["طلب كفته - 3 قطع + أرز + خضار + سلطة",100]]},
{c:"صواني الطاهي",ico:"🥘",items:[["صنية السيزون - كيلو كفته + نص فرخة + ربع سجق + أرز بسمتي",900],["صنية السويسي - فرخة + نص كفته + ربع سجق + أرز بسمتي",850]]},
{c:"ميكس الطاهي",ico:"🔥",items:[["ميكس كفته وطرب",170],["ميكس شيش واستربس",170],["ميكس كفته وشيش",170],["ميكس شيش وطرب",170],["ميكس استربس وكفته",170],["المكساوي - ميكس الطاهي المميز",180]]},
{c:"وجبات البروست",ico:"🍗",items:[["وجبة بروست الطاهي - 2 قطعة",160],["تربيل هيت - 3 قطع",200],["الذهبية - 4 قطع",250],["باور - 5 قطع",280],["لمه الحبايب - 10 قطع",420],["العمالقة - 12 قطعة",500],["الديك - 15 قطعة",600]]},
{c:"السلطات",ico:"🥗",items:[["سلطة خضراء",25],["طحينة",25],["بابا غنوج",30],["تومية",30],["كول سلو",30],["باذنجان مخلل",20]]},
{c:"أطباق جانبية",ico:"🍚",items:[["أرز ساده بالشعرية",25],["أرز بالكبده صغير",50],["أرز بالكبده كبير",60],["أرز بسمتي وسط",35],["أرز بسمتي كبير",55],["مكرونة فرن",35],["ملوخية",40],["شوربة لسان عصفور",25],["خضار حسب اليوم",25]]},
{c:"المشروبات",ico:"🥤",items:[["V Cola",23],["مياه صغيرة",12],["اسبايرو سباتس",18],["لتر مشروب مصري",35]]},
];
const imgMap={"المشويات":"https://images.unsplash.com/photo-1544025162-d76694265947?w=600","الوجبات":"https://images.unsplash.com/photo-1565557623262-b51c2513a641?w=600","السندوتشات":"https://images.unsplash.com/photo-1521390188846-e2a3a97453a0?w=600","كبده":"https://images.unsplash.com/photo-1585937421612-70a008356fbe?w=600","قسم المطبخ":"https://images.unsplash.com/photo-1504674900247-0877df9cc836?w=600","طلب كفته":"https://images.unsplash.com/photo-1555939594-58d7cb561ad1?w=600","صواني الطاهي":"https://images.unsplash.com/photo-1511690656952-a0c5a7722f1c?w=600","ميكس الطاهي":"https://images.unsplash.com/photo-1525183995014-b329225b9407?w=600","وجبات البروست":"https://images.unsplash.com/photo-1562967914-608f82629710?w=600","السلطات":"https://images.unsplash.com/photo-1540420773420-3366772f4999?w=600","أطباق جانبية":"https://images.unsplash.com/photo-1536304929831-ee1ca9d44906?w=600","المشروبات":"https://images.unsplash.com/photo-1551024709-8f23befc6f87?w=600"};
let active="المشويات";let searchQ="";
function getCart(){return JSON.parse(localStorage.getItem('tahey_cart')||'[]')}
function saveCart(c){localStorage.setItem('tahey_cart',JSON.stringify(c));update()}
function update(){let cart=getCart();document.getElementById('cartCount').innerText=cart.reduce((a,b)=>a+b.q,0);document.getElementById('cartTotal').innerText=cart.reduce((a,b)=>a+b.price*b.q,0)+' ج'}
function renderCats(){document.getElementById('cats').innerHTML=menuData.map(m=>`<div class="cat ${m.c==active?'active':''}" onclick="setCat('${m.c}')"><div class="ico">${m.ico}</div><div class="lbl">${m.c}</div></div>`).join('')}
function setCat(c){active=c;searchQ="";document.getElementById('search').value="";renderCats();renderGrid()}
function renderGrid(){
 let items=[];
 if(searchQ){menuData.forEach(cat=>cat.items.forEach(it=>{if(it[0].includes(searchQ))items.push({name:it[0],price:it[1],cat:cat.c,img:imgMap[cat.c]})}))}
 else {let cat=menuData.find(m=>m.c==active);items=cat.items.map(it=>({name:it[0],price:it[1],cat:cat.c,img:imgMap[cat.c]}))}
 document.getElementById('currentCat').innerText=(searchQ?`نتائج: ${searchQ}`:active);
 document.getElementById('count').innerText=items.length+" صنف";
 document.getElementById('grid').innerHTML=items.map(it=>{
   let shortName=it.name.split(' - ')[0];
   let desc=it.name.includes(' - ')?it.name.split(' - ').slice(1).join(' - '):`من ${it.cat} - طازج يوميا`;
   let inCart=getCart().find(x=>x.name==it.name);
   return `<div class="bigCard">
     <div class="imgWrap"><img src="${it.img}" loading="lazy"><div class="badge">${it.cat}</div><div class="priceBadge">${it.price} ج</div></div>
     <div class="info"><h4>${shortName}</h4><p>${desc}</p>
       <div class="cardFooter">
         ${inCart?`<div class="qtyCtrl"><button class="minus" onclick="changeQty('${it.name.replace(/'/g,'')}',-1)">-</button><span>${inCart.q}</span><button class="plus" onclick="changeQty('${it.name.replace(/'/g,'')}',1)">+</button></div><button class="addBtnBig" style="background:#232326;color:white" onclick="location.href='cart.html'">عرض السلة 🛒</button>`:`<button class="addBtnBig" onclick="addToCart('${it.name.replace(/'/g,'')}','${it.img}',${it.price})">اضافة للسلة +</button>`}
       </div>
     </div>
   </div>`;
 }).join('');
}
function filterSearch(){searchQ=document.getElementById('search').value.trim();if(searchQ){active="";renderCats()}else{active=menuData[0].c;renderCats()}renderGrid()}
function addToCart(name,img,price){let c=getCart();let f=c.find(x=>x.name==name);if(f)f.q++;else c.push({name,price,q:1,img});saveCart(c);renderGrid()}
function changeQty(name,d){let c=getCart();let f=c.find(x=>x.name==name);if(!f)return;f.q+=d;if(f.q<=0)c=c.filter(x=>x.name!=name);saveCart(c);renderGrid()}
renderCats();renderGrid();update();
let deferredPrompt;
window.addEventListener('beforeinstallprompt',(e)=>{e.preventDefault();deferredPrompt=e;document.getElementById('installBanner').style.display='flex'});
function installApp(){if(deferredPrompt){deferredPrompt.prompt();deferredPrompt.userChoice.then(()=>{deferredPrompt=null;document.getElementById('installBanner').style.display='none'})}}
if('serviceWorker' in navigator){navigator.serviceWorker.register('sw.js')}
</script>
</body>
</html>
