<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>الطاهي</title>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@700;900&display=swap" rel="stylesheet">
<script src="https://cdn.tailwindcss.com"></script>
<style>*{font-family:'Cairo'}body{background:#0F0F0F;color:#fff}.card{background:#1E1E20;border:1px solid rgba(255,255,255,.06)}.order-new{border-right:4px solid #C6FF00}.order-prep{border-right:4px solid #FF6A00}.order-way{border-right:4px solid #00C6FF}.order-done{border-right:4px solid #666;opacity:.6}</style>
</head>
<body class="bg-[#0A0A0A]">

<!-- LOGIN SIMPLE -->
<div id="loginScreen" class="fixed inset-0 z-[100] bg-[#0A0A0A] grid place-items-center p-6">
<div class="w-full max-w-[360px] card rounded-[20px] p-6 text-center">
<div class="text-[40px]">👨‍🍳</div><h1 class="text-[20px] font-black mt-2">لوحة تحكم الطاهي</h1><p class="text-[11px] text-white/40 mt-1">دخول المطبخ فقط</p>
<input id="pass" type="password" placeholder="كلمة السر" class="w-full mt-6 bg-black border border-white/10 rounded-full px-4 py-3 text-[13px] text-center">
<button onclick="login()" class="w-full mt-3 bg-[#FF6A00] text-black py-3 rounded-full font-black">دخول</button>
<p class="text-[10px] text-white/20 mt-3">الباسورد الافتراضي: 1234</p>
</div>
</div>

<!-- HEADER -->
<div class="sticky top-0 z-40 bg-[#0A0A0A]/95 backdrop-blur-xl border-b border-white/5 px-4 py-3 flex justify-between items-center">
<div><div class="font-black">مطبخ الطاهي 🔥</div><div class="text-[10px] text-white/40"><span id="liveCount">0</span> طلب نشط • <span id="todayTotal">0</span> طلب اليوم</div></div>
<div class="flex gap-2"><button onclick="toggleSound()" id="soundBtn" class="w-9 h-9 bg-[#1E1E20] rounded-full grid place-items-center">🔔</button><button onclick="clearDone()" class="px-3 py-2 bg-white/5 rounded-full text-[10px]">مسح المنتهي</button></div>
</div>

<!-- STATS -->
<div class="px-4 py-3 grid grid-cols-4 gap-2">
<div class="card rounded-[12px] p-2 text-center"><div class="text-[16px] font-black text-[#C6FF00]" id="statNew">0</div><div class="text-[8px] text-white/40">جديد</div></div>
<div class="card rounded-[12px] p-2 text-center"><div class="text-[16px] font-black text-[#FF6A00]" id="statPrep">0</div><div class="text-[8px] text-white/40">تحضير</div></div>
<div class="card rounded-[12px] p-2 text-center"><div class="text-[16px] font-black text-[#00C6FF]" id="statWay">0</div><div class="text-[8px] text-white/40">في الطريق</div></div>
<div class="card rounded-[12px] p-2 text-center"><div class="text-[16px] font-black" id="statToday">0 ج</div><div class="text-[8px] text-white/40">مبيعات اليوم</div></div>
</div>

<!-- FILTERS -->
<div class="px-4 flex gap-2 overflow-x-auto pb-2">
<button onclick="filterOrders('all')" data-f="all" class="f-btn bg-[#FF6A00] text-black px-4 py-2 rounded-full text-[11px] font-bold flex-shrink-0">الكل</button>
<button onclick="filterOrders('confirmed')" data-f="confirmed" class="f-btn bg-[#1E1E20] px-4 py-2 rounded-full text-[11px] flex-shrink-0">🟡 جديد</button>
<button onclick="filterOrders('preparing')" data-f="preparing" class="f-btn bg-[#1E1E20] px-4 py-2 rounded-full text-[11px] flex-shrink-0">🟠 تحضير</button>
<button onclick="filterOrders('onway')" data-f="onway" class="f-btn bg-[#1E1E20] px-4 py-2 rounded-full text-[11px] flex-shrink-0">🔵 في الطريق</button>
</div>

<!-- ORDERS LIST -->
<div id="ordersList" class="px-3 py-3 space-y-3 pb-[40px]"></div>

<audio id="notifSound" src="https://assets.mixkit.co/sfx/preview/mixkit-bell-notification-933.mp3" preload="auto"></audio>

<script>
let PASS='1234';
let orders=JSON.parse(localStorage.getItem('tahey_orders')||'[]');
let filter='all';
let soundOn=true;

function login(){if(document.getElementById('pass').value===PASS){document.getElementById('loginScreen').classList.add('hidden');render();setInterval(checkNew,1000)}else alert('باسورد غلط')}

function checkNew(){
let current=JSON.parse(localStorage.getItem('tahey_orders')||'[]');
if(current.length>orders.length){
if(soundOn)document.getElementById('notifSound').play().catch(()=>{});
if(Notification&&Notification.permission==='granted')new Notification('طلب جديد! 🔥',{body:`طلب #${current[current.length-1].id} - ${current[current.length-1].total}ج`});
orders=current;render();
}
}

function render(){
let list=document.getElementById('ordersList');
let filtered=filter==='all'?orders:orders.filter(o=>o.status===filter);
filtered=filtered.slice().reverse();
if(!filtered.length){list.innerHTML='<div class="text-center py-20 text-white/20">لا يوجد طلبات<br><span class="text-[10px]">الطلبات هتظهر هنا لحظياً</span></div>';}
else{
list.innerHTML=filtered.map(o=>{
let cls=o.status==='confirmed'?'order-new':o.status==='preparing'?'order-prep':o.status==='onway'?'order-way':'order-done';
let timeAgo=Math.floor((Date.now()-o.time)/60000);
return `<div class="card rounded-[16px] p-3 ${cls}">
<div class="flex justify-between items-start"><div><div class="font-black text-[13px]">طلب #${o.id} <span class="text-[10px] font-normal text-white/40">${timeAgo}د منذ</span></div><div class="text-[11px] mt-1">👤 ${o.name} - 📞 ${o.phone}</div><div class="text-[10px] text-white/50">📍 ${o.address}</div></div><div class="text-left"><div class="text-[#FF6A00] font-black text-[14px]">${o.total}ج</div><div class="text-[9px] text-white/40">${o.items.length} صنف</div></div></div>
<div class="mt-3 bg-black/50 rounded-[10px] p-2 text-[11px] leading-6">${o.items.map(i=>`• ${i.t} ×${i.qty} = ${i.p*i.qty}ج`).join('<br>')}</div>
<div class="mt-3 flex gap-2">
${o.status==='confirmed'?`<button onclick="updateStatus(${o.id},'preparing')" class="flex-1 bg-[#FF6A00] text-black py-2.5 rounded-full font-bold text-[11px]">بدء التحضير 👨‍🍳</button>`:''}
${o.status==='preparing'?`<button onclick="updateStatus(${o.id},'onway')" class="flex-1 bg-[#00C6FF] text-black py-2.5 rounded-full font-bold text-[11px]">خرج للتوصيل 🚚</button>`:''}
${o.status==='onway'?`<button onclick="updateStatus(${o.id},'delivered')" class="flex-1 bg-[#C6FF00] text-black py-2.5 rounded-full font-bold text-[11px]">تم التوصيل ✅</button>`:''}
${o.status!=='delivered'?`<button onclick="callCust('${o.phone}')" class="w-12 bg-[#25D366] rounded-full grid place-items-center">📞</button><button onclick="whatsCust(${o.id})" class="w-12 bg-white/10 rounded-full grid place-items-center">💬</button>`:''}
${o.status==='delivered'?`<div class="flex-1 text-center py-2 text-[11px] text-white/30">تم التوصيل - ${o.total}ج - ${o.earn||o.total} نقطة</div>`:''}
</div>
<div class="mt-2 flex gap-2 text-[9px]"><span class="bg-white/5 px-2 py-1 rounded-full">${o.status==='confirmed'?'🟡 جديد':o.status==='preparing'?'🟠 تحضير':o.status==='onway'?'🔵 في الطريق':'✅ تم'}</span><span class="bg-white/5 px-2 py-1 rounded-full">ETA: ${o.eta}</span><button onclick="printOrder(${o.id})" class="bg-white/5 px-2 py-1 rounded-full">🖨️ طباعة</button></div>
</div>`}).join('');
}
updateStats();
}

function updateStats(){
let today=orders.filter(o=>new Date(o.time).toDateString()===new Date().toDateString());
document.getElementById('statNew').innerText=orders.filter(o=>o.status==='confirmed').length;
document.getElementById('statPrep').innerText=orders.filter(o=>o.status==='preparing').length;
document.getElementById('statWay').innerText=orders.filter(o=>o.status==='onway').length;
document.getElementById('statToday').innerText=today.reduce((s,o)=>s+o.total,0)+'ج';
document.getElementById('liveCount').innerText=orders.filter(o=>o.status!=='delivered').length;
document.getElementById('todayTotal').innerText=today.length;
}

function updateStatus(id,newStatus){
let o=orders.find(x=>x.id===id);if(!o)return;
let map={preparing:{text:'جاري التحضير 👨‍🍳',eta:'12-15'},onway:{text:'في الطريق 🚚',eta:'5-8'},delivered:{text:'تم التوصيل ✅',eta:'تم'}};
o.status=newStatus;o.statusText=map[newStatus].text;o.eta=map[newStatus].eta;
localStorage.setItem('tahey_orders',JSON.stringify(orders));
render();
// Broadcast to customer tabs
let bc=new BroadcastChannel('tahey');bc.postMessage({type:'status',id,status:newStatus});bc.close();
}

function filterOrders(f){filter=f;document.querySelectorAll('.f-btn').forEach(b=>{b.classList.toggle('bg-[#FF6A00]',b.dataset.f===f);b.classList.toggle('text-black',b.dataset.f===f);b.classList.toggle('bg-[#1E1E20]',b.dataset.f!==f)});render()}
function callCust(ph){window.open(`tel:${ph}`)}
function whatsCust(id){let o=orders.find(x=>x.id===id);let msg=`أهلا ${o.name} - طلبك #${o.id} ${o.statusText}`;window.open(`https://wa.me/2${o.phone}?text=${encodeURIComponent(msg)}`)}
function printOrder(id){let o=orders.find(x=>x.id===id);let w=window.open('');w.document.write(`<html dir="rtl"><body style="font-family:sans-serif"><h2>الطاهي - طلب #${o.id}</h2><p>${o.name} - ${o.phone}<br>${o.address}</p><hr>${o.items.map(i=>`${i.t} ×${i.qty} = ${i.p*i.qty}ج`).join('<br>')}<hr><b>المجموع: ${o.total}ج</b><br><small>${new Date(o.time).toLocaleString('ar-EG')}</small></body></html>`);w.print()}
function toggleSound(){soundOn=!soundOn;document.getElementById('soundBtn').innerText=soundOn?'🔔':'🔕'}
function clearDone(){if(!confirm('مسح كل الطلبات المنتهية؟'))return;orders=orders.filter(o=>o.status!=='delivered');localStorage.setItem('tahey_orders',JSON.stringify(orders));render()}

if(Notification&&Notification.permission!=='granted')Notification.requestPermission();

// Listen for new orders from customer page
let bc=new BroadcastChannel('tahey');bc.onmessage=e=>{if(e.data.type==='new'){orders=JSON.parse(localStorage.getItem('tahey_orders')||'[]');render();if(soundOn)document.getElementById('notifSound').play().catch(()=>{})}};

render();
</script>
</body>
</html>
