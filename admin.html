<!DOCTYPE html><html lang="ar" dir="rtl"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>ادمن الطاهي - 88 صنف</title><script src="https://cdn.tailwindcss.com"></script><link href="https://fonts.googleapis.com/css2?family=Cairo:wght@700;900&display=swap" rel="stylesheet"><style>body{font-family:Cairo}</style></head><body class="bg-black text-white p-4"><div class="max-w-6xl mx-auto"><h1 class="text-3xl font-black text-orange-500">لوحة تحكم الطاهي - 88 صنف 🔥</h1><div class="flex gap-2 my-4"><button onclick="showTab('orders')" id="b1" class="bg-orange-600 px-6 py-3 rounded-xl font-bold">📦 الطلبات لايف</button><button onclick="showTab('products')" id="b2" class="bg-white/10 px-6 py-3 rounded-xl font-bold">➕ إضافة صنف</button></div><div id="tab-orders"><div id="orders-list" class="space-y-3"></div></div><div id="tab-products" class="hidden"><div class="bg-[#1e1e1e] p-5 rounded-2xl border border-white/10 mb-6"><h2 class="font-black mb-3">إضافة صنف جديد (هيبقى رقم 89+)</h2><div class="grid grid-cols-2 gap-2"><input id="p-name" placeholder="اسم الصنف" class="bg-black border border-white/20 p-3 rounded-xl"><input id="p-price" type="number" placeholder="السعر" class="bg-black border border-white/20 p-3 rounded-xl"><input id="p-cat" placeholder="القسم - اكتب نفس اسم القسم" class="bg-black border border-white/20 p-3 rounded-xl"><input id="p-emoji" placeholder="ايموجي 🥩" class="bg-black border border-white/20 p-3 rounded-xl"></div><button onclick="addProduct()" class="w-full bg-orange-600 py-3 rounded-xl mt-3 font-black">حفظ الصنف</button></div><div id="extra-list" class="grid md:grid-cols-2 gap-2"></div></div></div><script type="module">import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";import { getFirestore, collection, addDoc, getDocs, deleteDoc, doc, onSnapshot, query, orderBy, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";const firebaseConfig={apiKey:"AIzaSyArvJ3bcXrqnRXBW8Pr_hH1Ok-Me3hwdcQ",authDomain:"eltahey-1dadd.firebaseapp.com",projectId:"eltahey-1dadd",storageBucket:"eltahey-1dadd.firebasestorage.app",messagingSenderId:"998375782695",appId:"1:998375782695:web:87c49667b00c6459b39102"};const app=initializeApp(firebaseConfig);const db=getFirestore(app);window.showTab=(t)=>{document.getElementById('tab-orders').classList.toggle('hidden',t!='orders');document.getElementById('tab-products').classList.toggle('hidden',t!='products');document.getElementById('b1').className=t=='orders'?'bg-orange-600 px-6 py-3 rounded-xl font-bold':'bg-white/10 px-6 py-3 rounded-xl font-bold';document.getElementById('b2').className=t=='products'?'bg-orange-600 px-6 py-3 rounded-xl font-bold':'bg-white/10 px-6 py-3 rounded-xl font-bold';if(t=='products')loadExtra();};window.addProduct=async()=>{const name=document.getElementById('p-name').value.trim();const price=parseInt(document.getElementById('p-price').value);const cat=document.getElementById('p-cat').value.trim()||'إضافي';const emoji=document.getElementById('p-emoji').value.trim()||'🔥';if(!name||!price)return alert('اكتب الاسم والسعر');await addDoc(collection(db,'products'),{name,price,cat,emoji,createdAt:serverTimestamp()});alert('تم ✅');document.getElementById('p-name').value='';document.getElementById('p-price').value='';loadExtra();};async function loadExtra(){const snap=await getDocs(collection(db,'products'));const list=document.getElementById('extra-list');list.innerHTML='';snap.forEach(d=>{const p=d.data();list.innerHTML+=`<div class="bg-[#1e1e1e] p-4 rounded-xl flex justify-between border border-white/10"><div><b>${p.emoji} ${p.name}</b><br><span class="text-orange-400 text-sm">${p.price}ج - ${p.cat}</span></div><button onclick="delProd('${d.id}')" class="text-red-400">حذف</button></div>`;});}window.delProd=async(id)=>{if(confirm('تحذف؟')){await deleteDoc(doc(db,'products',id));loadExtra();}};const q=query(collection(db,'orders'),orderBy('createdAt','desc'));onSnapshot(q,(snap)=>{const list=document.getElementById('orders-list');if(snap.empty){list.innerHTML='<p class="text-center py-20 text-white/30">مفيش طلبات لسه</p>';return;}list.innerHTML='';snap.forEach(d=>{const o=d.data();const time=o.createdAt?.toDate().toLocaleString('ar-EG')||'الآن';list.innerHTML+=`<div class="bg-[#1e1e1e] p-5 rounded-2xl mb-3 border border-orange-500/20"><div class="flex justify-between"><b>${o.customerName} - ${o.phone}</b><span class="text-xs bg-orange-600 px-3 py-1 rounded-full">${time}</span></div><p class="text-white/50 text-sm">${o.address||''}</p><div class="bg-black p-3 rounded-xl mt-2 text-sm">${(o.items||[]).map(i=>`${i.name} x${i.qty} = ${i.price*i.qty}ج`).join('<br>')}</div><div class="font-black text-orange-400 mt-2">الإجمالي: ${o.total} جنيه</div></div>`;});});</script></body></html>
