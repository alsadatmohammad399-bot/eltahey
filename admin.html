<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>لوحة طلبات المطعم - الطاهي</title>
<script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 p-4">
<h1 class="text-3xl font-bold text-center mb-6">🔥 طلبات المطعم - لايف</h1>
<div id="orders" class="grid gap-4 max-w-3xl mx-auto"></div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
import { getFirestore, collection, onSnapshot, doc, updateDoc, orderBy, query } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

// حط الكونفيج بتاعك هنا نفس اللي في موقعك
const firebaseConfig = {
  apiKey: "YOUR_API_KEY",
  authDomain: "YOUR_PROJECT.firebaseapp.com",
  projectId: "YOUR_PROJECT_ID",
};
const app = initializeApp(firebaseConfig);
const db = getFirestore(app);

const q = query(collection(db, "orders"), orderBy("createdAt", "desc"));
onSnapshot(q, (snapshot) => {
  const container = document.getElementById("orders");
  container.innerHTML = "";
  snapshot.forEach((docSnap) => {
    const order = docSnap.data();
    const id = docSnap.id;
    container.innerHTML += `
      <div class="bg-white p-4 rounded-xl shadow">
        <div class="flex justify-between">
          <h2 class="font-bold text-lg">${order.customerName} - ${order.phone}</h2>
          <span class="bg-yellow-200 px-3 py-1 rounded-full text-sm">${order.status}</span>
        </div>
        <p class="mt-2 text-gray-600">${order.items.map(i => i.name + ' x' + i.qty).join(' - ')}</p>
        <p class="font-bold mt-2">الاجمالي: ${order.total} جنيه</p>
        <div class="flex gap-2 mt-3">
          <button onclick="updateStatus('${id}','جاري التحضير')" class="bg-blue-500 text-white px-3 py-1 rounded">تحضير</button>
          <button onclick="updateStatus('${id}','تم التوصيل')" class="bg-green-500 text-white px-3 py-1 rounded">تم التوصيل</button>
        </div>
      </div>
    `;
  });
});

window.updateStatus = async (id, status) => {
  await updateDoc(doc(db, "orders", id), { status });
}
</script>
</body>
</html>
