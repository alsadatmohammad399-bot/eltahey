<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>ادمن الطاهي</title><script src="https://cdn.tailwindcss.com"></script><link href="https://fonts.googleapis.com/css2?family=Cairo:wght@700;900&display=swap" rel="stylesheet"><style>body{font-family:Cairo}</style></head>
<body class="bg-black text-white p-4">
<div class="max-w-5xl mx-auto">
<h1 class="text-3xl font-black text-orange-500 mb-6">لوحة تحكم الطاهي 🔥</h1>
<div class="flex gap-2 mb-6">
<button onclick="showTab('orders')" id="btn-orders" class="bg-orange-600 px-6 py-3 rounded-xl font-bold">الطلبات لايف</button>
<button onclick="showTab('products')" id="btn-products" class="bg-white/10 px-6 py-3 rounded-xl font-bold">إدارة المنيو (88 صنف)</button>
</div>

<div id="tab-orders">
<div id="orders-list" class="space-y-3"></div>
</div>

<div id="tab-products" class="hidden">
<div class="bg-[#1e1e1e] p-6 rounded-2xl mb-6 border border-white/10">
<h2 class="font-black text-xl mb-4">إضافة صنف جديد</h2>
<div class="grid grid-cols-2 gap-3">
<input id="p-name" placeholder="اسم الصنف - مثال: كيلو كباب" class="bg-black border border-white/20 p-3 rounded-xl">
<input id="p-price" type="number" placeholder="السعر - مثال: 950" class="bg-black border border-white/20 p-3 rounded-xl">
<input id="p-cat" placeholder="القسم - مثال: المشويات" class="bg-black border border-white/20 p-3 rounded-xl">
<input id="p-emoji" placeholder="ايموجي 🥩" class="bg-black border border-white/20 p-3 rounded-xl">
<input id="p-desc" placeholder="وصف قصير" class="bg-black border border-white/20 p-3 rounded-xl col-span-2">
</div>
<button onclick="addProduct()" class="w-full bg-orange-600 py-4 rounded-xl mt-4 font-black text-lg">+ حفظ الصنف</button>
</div>
<div id="products-list" class="grid grid-cols-1 md:grid-cols-2 gap-3"></div>
</div>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
import { getFirestore, collection, addDoc, getDocs, deleteDoc, doc, onSnapshot, serverTimestamp, query, orderBy } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";
const firebaseConfig = { apiKey: "AIzaSyArvJ3bcXrqnRXBW8Pr_hH1Ok-Me3hwdcQ", authDomain: "eltahey-1dadd.firebaseapp.com", projectId: "eltahey-1dadd", storageBucket: "eltahey-1dadd.firebasestorage.app", messagingSenderId: "998375782695", appId: "1:998375782695:web:87c49667b00c6459b39102" };
const app = initializeApp(firebaseConfig); const db = getFirestore(app);

window.showTab = (t) => {
  document.getElementById('tab-orders').classList.toggle('hidden', t!=='orders');
  document.getElementById('tab-products').classList.toggle('hidden', t!=='products');
  document.getElementById('btn-orders').className = t=='orders' ? 'bg-orange-600 px-6 py-3 rounded-xl font-bold' : 'bg-white/10 px-6 py-3 rounded-xl font-bold';
  document.getElementById('btn-products').className = t=='products' ? 'bg-orange-600 px-6 py-3 rounded-xl font-bold' : 'bg-white/10 px-6 py-3 rounded-xl font-bold';
  if(t=='products') loadProducts();
}

window.addProduct = async () => {
  const name = document.getElementById('p-name').value.trim();
  const price = parseInt(document.getElementById('p-price').value);
  const cat = document.getElementById('p-cat').value.trim() || 'عام';
  const emoji = document.getElementById('p-emoji').value.trim() || '🔥';
  const desc = document.getElementById('p-desc').value.trim();
  if(!name || !price) return alert('اكتب الاسم والسعر');
  await addDoc(collection(db, 'products'), { name, price, cat, emoji, desc, createdAt: serverTimestamp() });
  alert('تمت الإضافة ✅'); document.getElementById('p-name').value=''; document.getElementById('p-price').value=''; loadProducts();
}

async function loadProducts(){
  const snap = await getDocs(collection(db, 'products'));
  const list = document.getElementById('products-list');
  list.innerHTML = '';
  snap.forEach(d => {
    const p = d.data();
    list.innerHTML += `<div class="bg-[#1e1e1e] p-4 rounded-xl flex justify-between border border-white/10"><div><b>${p.emoji} ${p.name}</b><br><span class="text-orange-400">${p.price}ج - ${p.cat}</span></div><button onclick="delProd('${d.id}')" class="text-red-400">حذف</button></div>`;
  });
}
window.delProd = async (id) => { if(confirm('تحذف؟')){ await deleteDoc(doc(db,'products',id)); loadProducts(); } }

const q = query(collection(db, 'orders'), orderBy('createdAt','desc'));
onSnapshot(q, (snap) => {
  const list = document.getElementById('orders-list');
  if(snap.empty){ list.innerHTML='<p class="text-white/40 text-center py-20">لسه مفيش طلبات</p>'; return; }
  list.innerHTML='';
  snap.forEach(d => {
    const o = d.data();
    const time = o.createdAt?.toDate().toLocaleString('ar-EG') || 'الآن';
    list.innerHTML += `<div class="bg-[#1e1e1e] p-5 rounded-2xl border border-orange-500/20"><div class="flex justify-between"><b class="text-xl">${o.customerName} - ${o.phone}</b><span class="text-xs bg-orange-600 px-3 py-1 rounded-full">${time}</span></div><p class="text-white/50 text-sm mt-1">${o.address||''}</p><div class="mt-3 bg-black p-3 rounded-xl text-sm">${(o.items||[]).map(i=>`${i.name} x${i.qty}`).join('<br>')}</div><div class="mt-2 font-black text-orange-400 text-xl">الإجمالي: ${o.total} جنيه</div></div>`;
  });
});
</script>
</body>
</html>
