<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>تأكيد الطلب - الطاهي</title>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@600;700;800&display=swap" rel="stylesheet">
<style>:root{--bg:#0e0e10;--card:#1c1c1f;--yellow:#FFD500;--gray:#9a9aa0;--red:#ff4d4d}*{margin:0;padding:0;box-sizing:border-box;font-family:'Cairo'}body{background:var(--bg);color:white;min-height:100vh}.header{padding:16px;display:flex;align-items:center;gap:12px;border-bottom:1px solid #222}.back{width:36px;height:36px;background:#232326;border-radius:50%;display:grid;place-items:center;text-decoration:none;color:white}.content{max-width:600px;margin:0 auto;padding:16px}.summary{background:var(--card);border-radius:16px;padding:16px;margin-bottom:16px}.itemRow{display:flex;justify-content:space-between;font-size:13px;padding:6px 0;border-bottom:1px dashed #333}.totalRow{display:flex;justify-content:space-between;font-weight:900;font-size:18px;margin-top:12px;padding-top:12px;border-top:2px solid #333}.totalRow span:last-child{color:var(--yellow)}.formBox{background:var(--card);border-radius:16px;padding:16px}.inputGroup{margin-bottom:14px}.inputGroup label{display:block;font-size:12px;color:var(--gray);margin-bottom:6px}.inputGroup input,.inputGroup select,.inputGroup textarea{width:100%;padding:14px;border-radius:12px;background:#232326;border:1.5px solid #333;color:white;outline:none}.inputGroup input:focus{border-color:var(--yellow)}.inputGroup input.error{border-color:var(--red)}.errorMsg{color:var(--red);font-size:11px;margin-top:4px;display:none}.btn{width:100%;padding:16px;border-radius:14px;border:none;font-weight:900;font-size:17px;cursor:pointer;margin-top:10px}.btnYellow{background:var(--yellow);color:black}</style></head>
<body>
<div class="header"><a href="cart.html" class="back">→</a><h2>تسجيل البيانات 📝</h2></div>
<div class="content">
<div class="summary"><h3>ملخص الطلب</h3><div id="summaryList"></div><div class="totalRow"><span>الإجمالي:</span><span id="total">0 ج</span></div></div>
<div class="formBox">
<div class="inputGroup"><label>الاسم *</label><input id="name" placeholder="اكتب اسمك"><div class="errorMsg" id="errName">الاسم مطلوب</div></div>
<div class="inputGroup"><label>رقم الموبايل *</label><input id="phone" placeholder="01xxxxxxxxx" type="tel"><div class="errorMsg" id="errPhone">رقم الموبايل مطلوب 11 رقم</div></div>
<div class="inputGroup"><label>العنوان بالتفصيل *</label><textarea id="address" rows="2" placeholder="المنطقة - الشارع - رقم البيت"></textarea><div class="errorMsg" id="errAddr">العنوان مطلوب</div></div>
<div class="inputGroup"><label>طريقة الاستلام</label><select id="delivery"><option>توصيل للمنزل</option><option>استلام من الفرع</option></select></div>
<div class="inputGroup"><label>ملاحظات</label><textarea id="notes" rows="2" placeholder="بدون شطة، دور تاني..."></textarea></div>
<button class="btn btnYellow" onclick="confirmOrder()">تأكيد وارسال عبر واتساب 🍖</button>
<p style="font-size:11px;color:var(--gray);text-align:center;margin-top:10px">لن يتم تحويلك للواتساب إلا بعد تسجيل البيانات كاملة</p>
</div></div>
<script>
function getCart(){return JSON.parse(localStorage.getItem('tahey_cart')||'[]')}
function renderSummary(){let cart=getCart();if(cart.length==0){window.location.href='index.html';return}document.getElementById('summaryList').innerHTML=cart.map(c=>`<div class="itemRow"><span>${c.name} x${c.q}</span><span>${c.price*c.q} ج</span></div>`).join('');document.getElementById('total').innerText=cart.reduce((a,b)=>a+b.price*b.q,0)+' ج'}
function validate(){let valid=true;let name=document.getElementById('name').value.trim();let phone=document.getElementById('phone').value.trim();let addr=document.getElementById('address').value.trim();document.getElementById('name').classList.remove('error');document.getElementById('errName').style.display='none';document.getElementById('phone').classList.remove('error');document.getElementById('errPhone').style.display='none';document.getElementById('address').classList.remove('error');document.getElementById('errAddr').style.display='none';if(name.length<3){document.getElementById('name').classList.add('error');document.getElementById('errName').style.display='block';valid=false}if(phone.length<11||!phone.startsWith('01')){document.getElementById('phone').classList.add('error');document.getElementById('errPhone').style.display='block';valid=false}if(addr.length<5){document.getElementById('address').classList.add('error');document.getElementById('errAddr').style.display='block';valid=false}return valid}
function confirmOrder(){if(!validate()){return}let cart=getCart();let name=document.getElementById('name').value.trim();let phone=document.getElementById('phone').value.trim();let addr=document.getElementById('address').value.trim();let delivery=document.getElementById('delivery').value;let notes=document.getElementById('notes').value.trim();let total=cart.reduce((a,b)=>a+b.price*b.q,0);let msg=`طلب جديد - مطعم الطاهي 🍖%0A%0A👤 الاسم: ${name}%0A📞 الموبايل: ${phone}%0A📍 العنوان: ${addr}%0A🚚 الاستلام: ${delivery}%0A${notes?`📝 ملاحظات: ${notes}%0A`:''}%0A----------------%0A🍽️ الطلبات:%0A${cart.map(c=>`- ${c.name} x${c.q} = ${c.price*c.q}ج`).join('%0A')}%0A----------------%0A💰 الإجمالي: ${total}ج`;localStorage.removeItem('tahey_cart');window.open(`https://wa.me/201001565299?text=${msg}`,'_blank');setTimeout(()=>{window.location.href='index.html'},1000)}
renderSummary();
</script></body></html>
